<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Meteor Defender</title>
    <link id="game-favicon" rel="icon" type="image/png" href="https://i.imgur.com/wTRhL4J.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles for Game Aesthetics */
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(125% 92% at 50% 118%, rgba(14, 64, 112, 0.86) 0%, rgba(8, 38, 72, 0.72) 38%, rgba(2, 12, 27, 0.94) 70%, #000000 100%),
                linear-gradient(180deg, #000000 0%, #020814 48%, #082745 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            touch-action: none; /* Prevent double-tap zoom etc. */
            display: flex;
            flex-direction: column;
            height: var(--app-height, 100dvh);
            min-height: var(--app-height, 100dvh);
            max-height: var(--app-height, 100dvh);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }

        #game-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(130% 92% at 50% 120%, rgba(17, 73, 126, 0.9) 0%, rgba(7, 39, 76, 0.76) 40%, rgba(2, 11, 25, 0.95) 72%, #000000 100%),
                linear-gradient(180deg, #000000 0%, #020814 46%, #082745 100%);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to canvas when not on UI elements */
        }

        #numpad-container {
            pointer-events: auto; /* Enable interaction for the unified control card */
            background: rgba(31, 40, 51, 0.92);
            padding: 10px 10px max(10px, env(safe-area-inset-bottom, 0px));
            border-top: 2px solid #66fcf1;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: 9px;
            z-index: 30;
            width: 100%;
        }

        .side-action-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .side-control-btn {
            min-height: 42px;
            border: 2px solid #45a29e;
            border-radius: 9px;
            background: #0b0c10;
            color: #66fcf1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.58rem;
            transition: all 0.15s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .side-control-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .side-control-btn:hover {
            background: #2b3947;
        }

        .side-control-btn:active {
            transform: scale(0.96);
            background: #45a29e;
            color: #0b0c10;
        }

        .side-control-btn.sound-btn {
            gap: 0;
            padding-left: 0;
            padding-right: 0;
        }

        .side-control-btn.sound-btn svg {
            width: 22px;
            height: 22px;
        }

        .hud-top {
            padding: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.62rem;
            color: #45a29e;
            text-shadow: 2px 2px 0px #000;
        }

        .hud-item {
            min-height: 42px;
            padding: 7px 6px;
            border: 1px solid rgba(102, 252, 241, 0.5);
            border-radius: 9px;
            background: rgba(11, 12, 16, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            line-height: 1.2;
        }

        .hud-value {
            color: #ffffff;
            font-size: 0.72rem;
        }

        .hud-item.life-gain-pulse {
            animation: lifeHudPulse 0.8s ease-out;
        }

        @keyframes lifeHudPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 72, 117, 0); }
            35% { transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 72, 117, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 72, 117, 0); }
        }

        .life-bonus-effect {
            position: fixed;
            z-index: 120;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 10px rgba(255, 72, 117, 0.9));
        }

        .life-bonus-heart {
            color: #ff4875;
            font-size: 44px;
            line-height: 1;
        }

        .life-bonus-text {
            margin-top: 5px;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.62rem;
            white-space: nowrap;
            text-shadow: 2px 2px 0 #000;
        }

        /* Adjust for Landscape */
        @media (orientation: landscape) {
            #numpad-container {
                position: absolute;
                top: 50%;
                right: 10px;
                bottom: auto;
                transform: translateY(-50%);
                width: 270px;
                height: min(390px, calc(var(--app-height, 100dvh) - 16px - env(safe-area-inset-bottom, 0px)));
                max-height: calc(var(--app-height, 100dvh) - 16px - env(safe-area-inset-bottom, 0px));
                border: 2px solid #66fcf1;
                border-radius: 14px;
                padding: 8px 8px max(8px, env(safe-area-inset-bottom, 0px));
                background: rgba(31, 40, 51, 0.88);
                box-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
                overflow: hidden;
            }
            #numpad-container .side-action-row,
            #numpad-container .hud-top {
                flex-shrink: 0;
            }
            #numpad-container .numpad-grid {
                flex: 1 1 auto;
                min-height: 0;
                grid-auto-rows: minmax(0, 1fr);
            }
            #game-container {
                /* Make room for the compact control card on the right */
                width: calc(100% - 290px); 
            }
            canvas {
                width: calc(100vw - 290px); /* Specific for landscape layout */
            }
        }
        
        /* Fallback if logic is tricky, force canvas to fill parent */
        #game-container canvas {
             width: 100%;
             height: 100%;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: clamp(34px, 9dvh, 50px);
            gap: clamp(5px, 1.5dvh, 8px);
            width: 100%;
            max-width: 300px;
            height: auto;
            align-self: center;
        }

        .numpad-btn {
            background-color: #1f2833;
            color: #c5c6c7;
            border: 2px solid #45a29e;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .numpad-btn:active {
            transform: scale(0.95);
            background-color: #45a29e;
            color: #1f2833;
        }
        
        .numpad-btn.hover-effect:hover {
             background-color: #2b3947;
        }

        .btn-action {
            background-color: #0b0c10;
            color: #66fcf1;
        }
        
        .btn-ok {
            background-color: #45a29e;
            color: #0b0c10;
            border-color: #66fcf1;
        }
        .btn-ok:active {
            background-color: #66fcf1;
        }

        #screens {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(125% 92% at 50% 118%, rgba(14, 64, 112, 0.86) 0%, rgba(8, 38, 72, 0.72) 38%, rgba(2, 12, 27, 0.96) 70%, #000000 100%),
                linear-gradient(180deg, #000000 0%, #020814 48%, #082745 100%);
            flex-direction: column;
            text-align: center;
        }
        
        .screen-content h1 {
            font-family: 'Press Start 2P', cursive;
            color: #66fcf1;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            font-size: 2rem;
            line-height: 1.5;
        }
        
        .screen-content p {
            color: #c5c6c7;
            margin-bottom: 30px;
            font-size: 1.2rem;
            max-width: 600px;
        }

        .play-btn {
            background-color: #45a29e;
            color: #0b0c10;
            border: 4px solid #66fcf1;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #66fcf1;
            transform: scale(1.05);
        }
        
        .play-btn:active {
            transform: scale(0.95);
        }
        
        .level-selection {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .level-selection label {
            font-family: 'Press Start 2P', cursive;
            color: #66fcf1;
            font-size: 1rem;
            text-shadow: 2px 2px 0px #000;
        }

        #start-screen {
            width: min(860px, 94vw);
            max-height: 94vh;
            overflow-y: auto;
            padding: 16px 18px;
            box-sizing: border-box;
        }

        #start-screen h1 {
            margin-bottom: 8px;
            font-size: clamp(1.35rem, 3vw, 2rem);
        }

        #start-screen p {
            margin: 0 auto 14px;
            font-size: 1rem;
        }

        .settings-grid {
            width: min(720px, 100%);
            margin: 0 auto 16px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 20px;
        }

        .settings-grid .level-selection {
            margin-bottom: 0;
            gap: 8px;
        }

        .settings-grid .level-selection label {
            font-size: 0.72rem;
            line-height: 1.4;
        }

        .operation-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            width: 100%;
            max-width: 330px;
        }

        .operation-options input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .operation-options label {
            min-height: 40px;
            padding: 0 8px;
            border: 2px solid #45a29e;
            border-radius: 8px;
            background: #1f2833;
            color: #c5c6c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            text-shadow: none;
            cursor: pointer;
            transition: all 0.15s;
        }

        .operation-options input:checked + label {
            background: #45a29e;
            color: #0b0c10;
            border-color: #66fcf1;
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.35);
        }

        .target-stepper {
            width: 100%;
            max-width: 300px;
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            gap: 8px;
            align-items: center;
        }

        .target-step-btn {
            height: 40px;
            border: 2px solid #45a29e;
            border-radius: 8px;
            background: #1f2833;
            color: #66fcf1;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .target-step-btn:active {
            transform: scale(0.95);
            background: #45a29e;
            color: #0b0c10;
        }

        .target-step-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .target-value {
            height: 40px;
            border: 2px solid #45a29e;
            border-radius: 8px;
            background: #0b0c10;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            #start-screen {
                padding-top: 20px;
                padding-bottom: 20px;
            }
        }

        .math-level-select {
            width: 100%;
            max-width: 300px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #45a29e;
            background: #1f2833;
            color: #c5c6c7;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100%;
            max-width: 300px;
            height: 15px;
            border-radius: 10px;
            background: #1f2833;
            outline: none;
            border: 2px solid #45a29e;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #66fcf1;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #66fcf1;
            cursor: pointer;
            border: none;
        }

        @media (orientation: landscape) and (max-height: 430px) {
            #numpad-container {
                gap: 5px;
                width: 250px;
            }

            #game-container {
                width: calc(100% - 270px);
            }

            .side-action-row,
            .hud-top {
                gap: 5px;
            }

            .side-control-btn,
            .hud-item {
                min-height: 34px;
                padding-top: 4px;
                padding-bottom: 4px;
            }

            .side-control-btn {
                font-size: 0.5rem;
            }

            .side-control-btn svg {
                width: 15px;
                height: 15px;
            }

            .hud-top {
                font-size: 0.52rem;
            }

            .hud-value {
                font-size: 0.62rem;
            }

            .numpad-btn {
                font-size: 1.18rem;
            }
        }

        /* Splash / preloader */
        #splash-screen {
            width: min(720px, 94vw);
            min-height: min(560px, 92dvh);
            padding: 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .splash-title {
            margin: 0 !important;
            color: #66fcf1 !important;
            font-size: clamp(0.8rem, 2.8vw, 1.35rem) !important;
            line-height: 1.35 !important;
            letter-spacing: 0.04em;
            white-space: nowrap;
            text-shadow: 3px 3px 0 #000, 0 0 16px rgba(102, 252, 241, 0.22) !important;
        }

        .splash-logo-wrap {
            width: min(470px, 82vw);
            height: min(260px, 34dvh);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #splash-logo {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 18px rgba(102, 252, 241, 0.25));
        }

        #splash-logo.offline-ship {
            width: min(260px, 54vw);
            height: min(260px, 30dvh);
            max-width: none;
            max-height: none;
            transform: rotate(60deg) scale(1.08);
            transform-origin: center;
            filter: drop-shadow(0 0 20px rgba(102, 252, 241, 0.36));
        }

        .asset-progress-wrap {
            width: min(420px, 82vw);
            padding-top: 2px;
            padding-bottom: 4px;
        }

        .asset-loading-label {
            margin: 0 0 28px;
            text-align: center;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.58rem, 1.8vw, 0.72rem);
            line-height: 1.5;
            letter-spacing: 0.12em;
            text-shadow: 2px 2px 0 #000, 0 0 12px rgba(102, 252, 241, 0.18);
            animation: assetLoadingColor 3.2s ease-in-out infinite;
        }

        @keyframes assetLoadingColor {
            0%, 100% { color: #ffffff; text-shadow: 2px 2px 0 #000, 0 0 6px rgba(102, 252, 241, 0.08); }
            50% { color: #66fcf1; text-shadow: 2px 2px 0 #000, 0 0 16px rgba(102, 252, 241, 0.42); }
        }

        .asset-progress-track {
            position: relative;
            height: 18px;
            border: 2px solid #45a29e;
            border-radius: 999px;
            background: rgba(31, 40, 51, 0.95);
            overflow: visible;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.45), 0 0 14px rgba(102,252,241,0.12);
            margin: 0 24px 30px;
        }

        #asset-progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #45a29e, #66fcf1);
            transition: width 0.22s ease;
        }

        #loading-ship {
            position: absolute;
            left: 0%;
            top: 50%;
            width: 48px;
            height: 48px;
            object-fit: contain;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center;
            transition: left 0.22s ease;
            filter: drop-shadow(0 0 9px rgba(102, 252, 241, 0.85));
            z-index: 2;
            pointer-events: none;
        }

        .asset-progress-meta {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            color: #c5c6c7;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.58rem;
            line-height: 1.5;
        }

        #asset-status {
            min-height: 38px;
            margin: 0;
            max-width: 560px;
            color: #c5c6c7;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #asset-status.offline {
            color: #ffd166;
        }

        #continue-btn {
            margin-top: 2px;
            padding: 12px 28px;
            font-size: 0.9rem;
        }

        @media (max-height: 520px) and (orientation: landscape) {
            #splash-screen {
                min-height: 0;
                gap: 8px;
            }

            .splash-title {
                font-size: 0.72rem !important;
            }

            .splash-logo-wrap {
                height: 112px;
            }

            #splash-logo.offline-ship {
                width: 118px;
                height: 118px;
                transform: rotate(60deg) scale(1.02);
            }

            .asset-loading-label {
                margin-bottom: 22px;
                font-size: 0.52rem;
            }

            .asset-progress-track {
                margin-bottom: 24px;
            }

            #asset-status {
                min-height: 28px;
                font-size: 0.78rem;
            }
        }

        #game-toast-layer {
            position: fixed;
            inset: 0;
            z-index: 150;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-toast {
            padding: 13px 18px;
            border: 2px solid #66fcf1;
            border-radius: 12px;
            background: rgba(4, 17, 31, 0.9);
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.56rem, 2vw, 0.78rem);
            line-height: 1.6;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 0 24px rgba(102, 252, 241, 0.25);
        }

        .game-toast.rescue {
            border-color: #ffd166;
            color: #ffd166;
            box-shadow: 0 0 26px rgba(255, 209, 102, 0.28);
        }

        #confetti-layer {
            position: fixed;
            inset: 0;
            z-index: 200;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -24px;
            width: 10px;
            height: 18px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            from { transform: translate3d(0, -8vh, 0) rotate(0deg); opacity: 1; }
            to { transform: translate3d(var(--drift), 116vh, 0) rotate(var(--spin)); opacity: 0.9; }
        }

        .hidden {
            display: none !important;
        }

        /* Star background style */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Menu / Game Over Screens -->
    <div id="screens">
        <div id="splash-screen" class="screen-content">
            <h1 class="splash-title">MATH METEOR DEFENDER</h1>

            <div class="splash-logo-wrap">
                <img id="splash-logo" alt="Math Meteor Defender" draggable="false">
            </div>

            <div class="asset-progress-wrap">
                <div class="asset-loading-label" aria-live="polite">MEMUAT ASET: <span id="asset-progress-text">0%</span></div>
                <div class="asset-progress-track">
                    <div id="asset-progress-fill"></div>
                    <img id="loading-ship" alt="" aria-hidden="true" draggable="false">
                </div>
            </div>

            <p id="asset-status">Menyiapkan pesawat, meteor, alien, dan laser...</p>
            <button id="continue-btn" class="play-btn hidden" type="button">LANJUTKAN</button>
        </div>

        <div id="start-screen" class="screen-content hidden">
            <h1>MATH METEOR<br>DEFENDER</h1>
            <p>Pilih meteor, ketik jawaban dari soal hitungannya, lalu tekan OK untuk menembak!</p>

            <div class="settings-grid">
                <div class="level-selection">
                    <label>OPERASI</label>
                    <div class="operation-options">
                        <input type="radio" id="operation-add" name="operation-mode" value="add" checked>
                        <label for="operation-add">Tambah +</label>
                        <input type="radio" id="operation-subtract" name="operation-mode" value="subtract">
                        <label for="operation-subtract">Kurang −</label>
                        <input type="radio" id="operation-mixed" name="operation-mode" value="mixed">

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        // UI Elements
        const screens = document.getElementById('screens');
        const splashScreen = document.getElementById('splash-screen');
        const splashLogo = document.getElementById('splash-logo');
        const loadingShip = document.getElementById('loading-ship');
        const assetProgressFill = document.getElementById('asset-progress-fill');
        const assetProgressText = document.getElementById('asset-progress-text');
        const assetStatus = document.getElementById('asset-status');
        const continueBtn = document.getElementById('continue-btn');

        const gameOverScreen = document.getElementById('game-over-screen');
        const winScreen = document.getElementById('win-screen');
        const uiLayer = document.getElementById('ui-layer');
        const numpadContainer = document.getElementById('numpad-container');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const livesHudItem = document.getElementById('lives-hud-item');
        const finalScoreDisplay = document.getElementById('final-score');
        const winScoreDisplay = document.getElementById('win-score');
        const targetScoreHud = document.getElementById('target-score-hud');
        
        const mathLevelSelect = document.getElementById('math-level-select');
        const levelSlider = document.getElementById('level-slider');
        const levelDisplay = document.getElementById('level-display');
        const densitySlider = document.getElementById('density-slider');
        const densityDisplay = document.getElementById('density-display');
        const targetScoreValue = document.getElementById('target-score-value');
        
        // Buttons
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const winRestartBtn = document.getElementById('win-restart-btn');
        const homeBtn = document.getElementById('home-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const soundBtn = document.getElementById('sound-btn');
        const gameToastLayer = document.getElementById('game-toast-layer');
        const confettiLayer = document.getElementById('confetti-layer');
        const targetMinusBtn = document.getElementById('target-minus');
        const targetPlusBtn = document.getElementById('target-plus');
        const numBtns = document.querySelectorAll('.numpad-btn[data-val]');
        const delBtn = document.getElementById('btn-del');
        const okBtn = document.getElementById('btn-ok');

        // Game State Variables
        let gameState = 'LOADING'; // LOADING, START, PLAYING, VICTORY_PENDING, VICTORY_CLEAR, VICTORY_EXIT, GAMEOVER, WIN
        let score = 0;
        let lives = 3;
        let alienKills = 0;
        let targetScore = 100;
        let selectedTargetScore = 100;
        let pendingWin = false;
        let victoryPendingTimer = 0;
        let animationId;
        let lastTime = 0;
        
        // Entity Arrays
        let meteors = [];
        let lasers = [];
        let explosions = [];
        let scorePopups = [];
        
        // Current Input State
        let currentInput = "";
        let selectedMeteor = null;
        
        // Difficulty and Timing
        let meteorSpawnTimer = 0;
        let meteorSpawnInterval = 7000;
        let maxMeteorsOnScreen = 3;
        let baseMeteorSpeed = 15; // Jatuh lebih lambat di awal
        let timeElapsed = 0;
        let currentSpeedMultiplier = 0.5; // Default Level 5 (50%)
        let currentMathLevel = 1;
        let currentOperation = 'add';
        let currentDensityLevel = 3;

        const mathLevelConfigs = {
            1: { add: [[1, 5], [1, 5]], subtract: [[1, 5], [1, 5]] },
            2: { add: [[1, 5], [5, 10]], subtract: [[5, 10], [1, 5]] },
            3: { add: [[1, 5], [10, 15]], subtract: [[10, 15], [1, 5]] },
            4: { add: [[1, 5], [15, 20]], subtract: [[15, 20], [1, 5]] },
            5: { add: [[5, 10], [5, 10]], subtract: [[5, 10], [5, 10]] },
            6: { add: [[5, 10], [10, 15]], subtract: [[10, 15], [5, 10]] },
            7: { add: [[5, 10], [15, 20]], subtract: [[15, 20], [5, 10]] },
            8: { add: [[1, 10], [20, 90]], subtract: [[20, 90], [1, 10]] }
        };

        const densityConfigs = {
            1: { interval: 9000, maxMeteors: 2 },
            2: { interval: 8000, maxMeteors: 3 },
            3: { interval: 7000, maxMeteors: 3 },
            4: { interval: 6200, maxMeteors: 4 },
            5: { interval: 5400, maxMeteors: 4 },
            6: { interval: 4700, maxMeteors: 5 },
            7: { interval: 4000, maxMeteors: 6 },
            8: { interval: 3400, maxMeteors: 7 },
            9: { interval: 2900, maxMeteors: 8 },
            10: { interval: 2400, maxMeteors: 10 }
        };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateMathLevelLabels() {
            const selectedOperation = document.querySelector('input[name="operation-mode"]:checked').value;
            const symbol = selectedOperation === 'add' ? '+' : selectedOperation === 'subtract' ? '−' : '±';

            Object.keys(mathLevelConfigs).forEach(level => {
                const config = mathLevelConfigs[level];
                const ranges = selectedOperation === 'subtract' ? config.subtract : config.add;
                const option = mathLevelSelect.querySelector(`option[value="${level}"]`);
                option.textContent = `Level ${level} (${ranges[0][0]}-${ranges[0][1]} ${symbol} ${ranges[1][0]}-${ranges[1][1]})`;
            });
        }

        function updateTargetScoreControls() {
            targetScoreValue.innerText = selectedTargetScore;
            targetMinusBtn.disabled = selectedTargetScore <= 50;
            targetPlusBtn.disabled = selectedTargetScore >= 500;
        }

        function changeTargetScore(delta) {
            selectedTargetScore = Math.max(50, Math.min(500, selectedTargetScore + delta));
            updateTargetScoreControls();
        }

        levelSlider.addEventListener('input', (e) => {
            levelDisplay.innerText = e.target.value;
        });

        densitySlider.addEventListener('input', (e) => {
            densityDisplay.innerText = e.target.value;
        });

        document.querySelectorAll('input[name="operation-mode"]').forEach(input => {
            input.addEventListener('change', updateMathLevelLabels);
        });

        function bindTargetHoldButton(button, delta) {
            let holdDelayTimer = null;
            let holdRepeatTimer = null;

            const clearHoldTimers = () => {
                clearTimeout(holdDelayTimer);
                clearInterval(holdRepeatTimer);
                holdDelayTimer = null;
                holdRepeatTimer = null;
            };

            const stepTarget = () => {
                if (button.disabled) {
                    clearHoldTimers();
                    return;
                }
                changeTargetScore(delta);
                if (button.disabled) clearHoldTimers();
            };

            button.addEventListener('pointerdown', (e) => {
                if (button.disabled) return;
                e.preventDefault();
                clearHoldTimers();
                if (button.setPointerCapture) {
                    try { button.setPointerCapture(e.pointerId); } catch (error) {}
                }

                // Sentuhan/klik singkat tetap mengubah 10 poin sekali.
                stepTarget();

                // Tahan sebentar, lalu ulangi otomatis agar cepat menuju target jauh.
                holdDelayTimer = setTimeout(() => {
                    holdRepeatTimer = setInterval(stepTarget, 95);
                }, 430);
            });

            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(eventName => {
                button.addEventListener(eventName, clearHoldTimers);
            });

            // Cegah click sintetis menambah satu langkah lagi setelah pointerdown.
            button.addEventListener('click', (e) => e.preventDefault());

            // Tetap mendukung aktivasi tombol melalui keyboard.
            button.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!e.repeat) stepTarget();
                    else if (!button.disabled) stepTarget();
                }
            });
        }

        bindTargetHoldButton(targetMinusBtn, -10);
        bindTargetHoldButton(targetPlusBtn, 10);
        updateMathLevelLabels();
        updateTargetScoreControls();

        // Audio arcade + seluruh efek suara dibuat dengan Web Audio API agar tetap tersedia offline.
        let audioEnabled = true;
        let audioCtx = null;
        let masterGain = null;
        let masterCompressor = null;
        let masterOutputGain = null;
        let musicTimer = null;
        let musicStep = 0;
        const normalizedMasterLevel = 3.2;
        const musicNotes = [220.00, 277.18, 329.63, 277.18, 196.00, 246.94, 293.66, 246.94];

        function ensureAudio() {
            if (!audioEnabled) return null;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;

            if (!audioCtx) {
                audioCtx = new AudioContextClass();

                // Normalisasi/mastering ringan: sinyal dinaikkan lalu ditahan compressor
                // agar terdengar penuh pada HP/PC tanpa mudah clipping saat banyak efek berbunyi bersamaan.
                masterGain = audioCtx.createGain();
                masterGain.gain.value = normalizedMasterLevel;

                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.value = -18;
                masterCompressor.knee.value = 18;
                masterCompressor.ratio.value = 8;
                masterCompressor.attack.value = 0.003;
                masterCompressor.release.value = 0.18;

                masterOutputGain = audioCtx.createGain();
                masterOutputGain.gain.value = 0.95;

                masterGain.connect(masterCompressor);
                masterCompressor.connect(masterOutputGain);
                masterOutputGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function playTone(freq, duration = 0.1, type = 'square', volume = 0.04, endFreq = null, delay = 0) {
            if (!audioEnabled) return;
            const ac = ensureAudio();
            if (!ac || !masterGain) return;
            const start = ac.currentTime + delay;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(Math.max(30, freq), start);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), start + duration);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(start);
            osc.stop(start + duration + 0.03);
        }

        function playNoise(duration = 0.12, volume = 0.025) {
            if (!audioEnabled) return;
            const ac = ensureAudio();
            if (!ac || !masterGain) return;
            const length = Math.max(1, Math.floor(ac.sampleRate * duration));
            const buffer = ac.createBuffer(1, length, ac.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
            const src = ac.createBufferSource();
            const gain = ac.createGain();
            src.buffer = buffer;
            gain.gain.setValueAtTime(volume, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
            src.connect(gain);
            gain.connect(masterGain);
            src.start();
        }

        function playSfx(name) {
            if (!audioEnabled) return;
            switch (name) {
                case 'shoot':
                    playTone(720, 0.09, 'sawtooth', 0.035, 1080);
                    break;
                case 'wrong':
                    playTone(210, 0.16, 'square', 0.035, 120);
                    break;
                case 'explosion':
                    playNoise(0.16, 0.04);
                    playTone(140, 0.18, 'sawtooth', 0.025, 55);
                    break;
                case 'alienExplosion':
                    playNoise(0.13, 0.03);
                    playTone(390, 0.18, 'triangle', 0.03, 120);
                    break;
                case 'lifeLost':
                    playTone(180, 0.18, 'square', 0.035, 90);
                    break;
                case 'lifeBonus':
                    playTone(523.25, 0.12, 'triangle', 0.035);
                    playTone(659.25, 0.13, 'triangle', 0.035, null, 0.09);
                    playTone(783.99, 0.16, 'triangle', 0.04, null, 0.18);
                    break;
                case 'rescue':
                    playTone(392, 0.12, 'square', 0.035);
                    playTone(523.25, 0.16, 'square', 0.035, null, 0.11);
                    break;
                case 'finalAttack':
                    playTone(330, 0.22, 'sawtooth', 0.04, 880);
                    playTone(440, 0.22, 'sawtooth', 0.035, 1100, 0.05);
                    break;
                case 'win':
                    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, 0.25, 'triangle', 0.045, null, i * 0.13));
                    break;
                case 'lose':
                    playTone(330, 0.24, 'sawtooth', 0.04, 180);
                    playTone(180, 0.35, 'square', 0.035, 70, 0.18);
                    break;
            }
        }

        function musicTick() {
            if (!audioEnabled || !['PLAYING', 'VICTORY_PENDING', 'VICTORY_CLEAR', 'VICTORY_EXIT'].includes(gameState)) return;
            const note = musicNotes[musicStep % musicNotes.length];
            playTone(note, 0.13, 'square', 0.012);
            if (musicStep % 4 === 0) playTone(note / 2, 0.18, 'triangle', 0.008);
            musicStep++;
        }

        function startMusic() {
            if (!audioEnabled || musicTimer) return;
            ensureAudio();
            musicStep = 0;
            musicTick();
            musicTimer = setInterval(musicTick, 260);
        }

        function stopMusic() {
            if (musicTimer) clearInterval(musicTimer);
            musicTimer = null;
        }

        function renderSoundIcon() {
            if (!soundBtn) return;
            soundBtn.setAttribute('aria-label', audioEnabled ? 'Matikan suara' : 'Nyalakan suara');
            soundBtn.innerHTML = audioEnabled
                ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z"></path><path d="M16 9c1.4 1.4 1.4 4.6 0 6"></path><path d="M18.5 6.5c3 3 3 8 0 11"></path></svg>'
                : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z"></path><path d="m17 9 5 5"></path><path d="m22 9-5 5"></path></svg>';
        }

        function toggleSound() {
            audioEnabled = !audioEnabled;
            if (!audioEnabled) {
                stopMusic();
                if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
            } else {
                ensureAudio();
                if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(normalizedMasterLevel, audioCtx.currentTime, 0.01);
                if (['PLAYING', 'VICTORY_PENDING', 'VICTORY_CLEAR', 'VICTORY_EXIT'].includes(gameState)) startMusic();
            }
            renderSoundIcon();
        }

        renderSoundIcon();

        // Image Assets + SVG fallback bawaan agar game tetap bisa dimainkan offline

        function loadImageSource(image, src, timeoutMs = 7000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                const finish = (ok, error) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    image.onload = null;
                    image.onerror = null;
                    ok ? resolve(image) : reject(error || new Error('Gagal memuat gambar'));
                };

                const timer = setTimeout(() => finish(false, new Error('Timeout')), timeoutMs);
                image.onload = () => finish(true);
                image.onerror = () => finish(false, new Error('Gagal memuat'));
                image.src = src;

                if (image.complete && image.naturalWidth > 0) {
                    finish(true);
                }
            });
        }

            try {
                await loadImageSource(entry.image, assetUrls[entry.key]);
                return { key: entry.key, online: true };

                try {
                    await loadImageSource(entry.image, entry.fallback, 2000);
                } catch (fallbackError) {
                    // Data-URI SVG seharusnya selalu tersedia. Jika browser sangat lama,
                    // draw fallback langsung tetap digunakan oleh fungsi drawImageContained.
                }
                return { key: entry.key, online: false };
            }
        }

            const jobs = preloadEntries.map(async entry => {

                if (entry.key === 'ship') {

        // Fungsi pembantu untuk menggambar dengan skala proporsional (object-fit: contain)
        function drawImageContained(ctx, img, cx, cy, maxWidth, maxHeight) {
            if (!img.complete || img.naturalWidth === 0) return; // Pastikan gambar sudah selesai di-load
            
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const boxRatio = maxWidth / maxHeight;
            
            let drawW, drawH;
            
            if (imgRatio > boxRatio) {
                // Gambar lebih lebar dari rasio kontainer (mentok di batas lebar)
                drawW = maxWidth;
                drawH = maxWidth / imgRatio;
            } else {
                // Gambar lebih tinggi dari rasio kontainer (mentok di batas tinggi)
                drawH = maxHeight;
                drawW = maxHeight * imgRatio;
            }
            
            // Gambar diletakkan persis di tengah (cx, cy)
            ctx.drawImage(img, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
        }

            ship.y = viewHeight - ship.height / 2 - 20; // 20px padding from bottom
        }

                    break;
                }

                // Aim ship

                const dy = selectedMeteor.y - ship.y;

        class Meteor {
            constructor() {
                // Generate problem sesuai Level Hitungan 1-8 dan operasi dari Game Berhitung Rafa & Hanan
                const config = mathLevelConfigs[currentMathLevel];
                const operationForQuestion = currentOperation === 'mixed'
                    ? (Math.random() > 0.5 ? 'add' : 'subtract')
                    : currentOperation;
                const ranges = currentOperation === 'mixed'
                    ? config.subtract
                    : (operationForQuestion === 'add' ? config.add : config.subtract);

                let validProblem = false;
                let attempts = 0;
                while (!validProblem && attempts < 100) {
                    attempts++;
                    this.num1 = getRandomInt(ranges[0][0], ranges[0][1]);
                    this.num2 = getRandomInt(ranges[1][0], ranges[1][1]);

                    if (operationForQuestion === 'add' && currentOperation === 'add' && Math.random() > 0.5) {
                        const temp = this.num1;
                        this.num1 = this.num2;
                        this.num2 = temp;
                    }

                    if (operationForQuestion === 'subtract' && this.num2 > this.num1) {
                        const temp = this.num1;
                        this.num1 = this.num2;
                        this.num2 = temp;
                    }

                    this.operator = operationForQuestion === 'add' ? '+' : '−';
                    this.answer = operationForQuestion === 'add'
                        ? this.num1 + this.num2
                        : this.num1 - this.num2;
                    validProblem = this.answer <= 99;
                }

                this.problemString = `${this.num1} ${this.operator} ${this.num2}`;
                
                // Appearance
                this.radius = 45; // Ukuran disesuaikan untuk gambar
                this.isAlien = Math.random() < 0.2; // 20% peluang muncul Alien
                this.image = this.isAlien ? imgAlien : astImages[Math.floor(Math.random() * astImages.length)];
                
                // Spawn position
                this.x = Math.random() * (viewWidth - this.radius * 2) + this.radius;
                this.y = -this.radius; // Start slightly above screen
                
                // Speed increases slightly over time
                let speedMultiplier = 1 + (timeElapsed / 120000); // Bertambah cepat tiap 2 menit
                
                this.speed = (baseMeteorSpeed + Math.random() * 10) * speedMultiplier * currentSpeedMultiplier;
                
                // Visual variation
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 1.5; // rad/sec
            }

            update(dt) {
                this.y += this.speed * dt;
                this.rotation += this.rotSpeed * dt;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Highlight if selected
                if (selectedMeteor === this) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#66fcf1';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(102, 252, 241, 0.3)';
                    ctx.fill();
                }
                
                // Draw Image
                if (!this.isAlien) {
                    ctx.rotate(this.rotation); // Hanya asteroid yang berputar
                }
                
                drawImageContained(ctx, this.image, 0, 0, this.radius * 2, this.radius * 2);
                
                if (!this.isAlien) {
                    ctx.rotate(-this.rotation); // Kembalikan rotasi agar teks tegak
                }
                
                // Draw Text Problem
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Roboto';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Garis luar teks agar terbaca jelas di atas gambar terang
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'black';
                ctx.strokeText(this.problemString, 0, 0);
                
                ctx.shadowBlur = 4;
                ctx.shadowColor = 'black';
                ctx.fillText(this.problemString, 0, 0);
                
                ctx.restore();
            }
        }

        class Laser {
            constructor(startX, startY, targetMeteor, isDud, isFinalSalvo = false) {
                this.x = startX;
                this.y = startY;
                this.target = targetMeteor;
                this.isDud = isDud; // Penanda jika laser salah jawaban
                this.isFinalSalvo = isFinalSalvo;
                this.awardsPoint = !isDud && !isFinalSalvo;
                this.speed = isFinalSalvo ? 950 : 800; // Salvo kemenangan dibuat sedikit lebih cepat dan homing.
                this.active = true;
                
                this.width = 15;
                this.height = 45;
                
                this.scale = 1.0;
                this.life = 0;
                this.maxLife = 0.8; // Waktu maksimal laser dud bertahan (detik)
                
                // Calculate trajectory
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.max(0.0001, Math.hypot(dx, dy));
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
                
                // Fixed angle pointing at target initially
                this.angle = Math.atan2(dy, dx);
            }
            
            update(dt) {
                // Logika jika jawaban salah (Laser Dud)
                if (this.isDud) {
                    this.life += dt;
                    this.scale = 1.0 - (this.life / this.maxLife);
                    
                    // Bergerak lambat ke target tapi tidak pernah sampai
                    this.x += this.vx * dt * 0.4;
                    this.y += this.vy * dt * 0.4;
                    
                    if (this.life >= this.maxLife || this.scale <= 0) {
                        this.active = false;
                    }
                    return false;
                }

                // Salvo kemenangan mengikuti posisi meteor yang tetap bergerak.
                if (this.isFinalSalvo) {
                    if (!this.target || this.target.dead) {
                        this.active = false;
                        return false;
                    }

                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.max(0.0001, Math.hypot(dx, dy));
                    this.angle = Math.atan2(dy, dx);

                    if (dist <= this.target.radius + this.speed * dt) {
                        this.x = this.target.x;
                        this.y = this.target.y;
                        this.active = false;
                        return true;
                    }

                    this.vx = (dx / dist) * this.speed;
                    this.vy = (dy / dist) * this.speed;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    return false;
                }
                
                // Logika Laser Normal (Jawaban Benar)
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                // Check if reached target (approximate hit detection based on distance)
                if (this.target) {
                   const dx = this.target.x - this.x;
                   const dy = this.target.y - this.y;
                   if (Math.hypot(dx, dy) < this.target.radius) {
                       this.active = false;
                       return true; // Hit target
                   }
                }
                
                // Remove if off screen
                if (this.x < 0 || this.x > viewWidth || this.y < 0 || this.y > viewHeight) {
                    this.active = false;
                }
                return false;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                // Sesuaikan rotasi +90 derajat (Math.PI/2) agar gambar mengarah ke target
                ctx.rotate(this.angle + Math.PI / 2); 
                ctx.scale(this.scale, this.scale); // Scale untuk mengecilkan dud
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#66fcf1';
                
                drawImageContained(ctx, imgLaser, 0, 0, this.width, this.height);
                
                ctx.restore();
            }
        }

        class FloatingScore {

            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                for(let i=0; i<20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 50 + Math.random() * 150;
                    this.particles.push({

                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        color: Math.random() > 0.5 ? '#66fcf1' : '#45a29e'
                    });
                }
                this.active = true;
            }
            
            update(dt) {
                let aliveCount = 0;
                this.particles.forEach(p => {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt * 2; // Die over 0.5 sec
                    if (p.life > 0) aliveCount++;
                });
                if (aliveCount === 0) this.active = false;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                this.particles.forEach(p => {
                    if (p.life > 0) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                ctx.restore();
            }
        }

        function checkAnswer() {
            if (!selectedMeteor || selectedMeteor.dead || selectedMeteor.isTargeted) return;
            if (currentInput === "") return;
            
            const numInput = parseInt(currentInput);
            const tipRadius = ship.height / 2;
            const tipX = ship.x + Math.sin(ship.angle) * tipRadius;
            const tipY = ship.y - Math.cos(ship.angle) * tipRadius;
            
            if (numInput === selectedMeteor.answer) {
                // Jawaban benar tetap menjalani tembakan normal sampai benar-benar mengenai target.
                // Poin +10 diberikan saat meteor/alien meledak, bukan saat tombol OK ditekan.
                const target = selectedMeteor;
                target.isTargeted = true;
                lasers.push(new Laser(tipX, tipY, target, false));
                playSfx('shoot');
                selectedMeteor = null;
                currentInput = "";
            } else {
                // Jawaban salah: laser dud dan input dikosongkan untuk mencoba lagi.
                lasers.push(new Laser(tipX, tipY, selectedMeteor, true));
                playSfx('wrong');
                currentInput = "";
            }
        }

        function beginVictoryPending() {
            if (gameState !== 'PLAYING') return;
            gameState = 'VICTORY_PENDING';
            pendingWin = true;
            victoryPendingTimer = 0.55; // Beri waktu ledakan tembakan pencapai target terlihat dahulu.
            currentInput = "";
            selectedMeteor = null;
            ship.angle = 0;
        }

        function beginVictoryClear() {
            if (gameState !== 'VICTORY_PENDING' && gameState !== 'PLAYING') return;

            gameState = 'VICTORY_CLEAR';
            pendingWin = true;
            currentInput = "";
            selectedMeteor = null;
            ship.angle = 0;

            // Sesudah tembakan pencapai target selesai meledak, barulah salvo otomatis dimulai.
            // Kotak input tidak lagi digambar mulai fase ini.
            lasers = [];
            playSfx('finalAttack');

            const tipX = ship.x;
            const tipY = ship.y - ship.height / 2;
            const activeTargets = meteors.filter(m => !m.dead);

            activeTargets.forEach(target => {
                target.isTargeted = true;
                lasers.push(new Laser(tipX, tipY, target, false, true));
            });
        }

        function beginVictoryExit() {
            if (gameState !== 'VICTORY_CLEAR') return;
            gameState = 'VICTORY_EXIT';
            pendingWin = true;
            currentInput = "";
            selectedMeteor = null;
            ship.angle = 0;
            lasers = [];
        }

        function showLifeBonusEffect(x, y) {
            const canvasRect = canvas.getBoundingClientRect();
            const livesRect = livesDisplay.getBoundingClientRect();
            const startX = canvasRect.left + x;
            const startY = canvasRect.top + y;
            const endX = livesRect.left + livesRect.width / 2;
            const endY = livesRect.top + livesRect.height / 2;

            const effect = document.createElement('div');
            effect.className = 'life-bonus-effect';
            effect.style.left = `${startX}px`;
            effect.style.top = `${startY}px`;
            effect.innerHTML = '<div class="life-bonus-heart">♥</div><div class="life-bonus-text">+1 NYAWA</div>';
            document.body.appendChild(effect);

            const moveX = endX - startX;
            const moveY = endY - startY;
            const animation = effect.animate([
                { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 0 },
                { transform: 'translate(-50%, -65%) scale(1.2)', opacity: 1, offset: 0.25 },
                { transform: `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) scale(0.7)`, opacity: 1 }
            ], {
                duration: 950,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => effect.remove();
        }

        function awardAlienLifeBonus(target) {
            alienKills++;
            if (alienKills % 3 !== 0) return;

            lives++;
            livesDisplay.innerText = lives;
            playSfx('lifeBonus');
            showLifeBonusEffect(target.x, target.y);

            livesHudItem.classList.remove('life-gain-pulse');
            void livesHudItem.offsetWidth;
            livesHudItem.classList.add('life-gain-pulse');
        }

        function drawShip(ctx) {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            
            // Draw Ship Body
            ctx.rotate(ship.angle);
            
            drawImageContained(ctx, imgShip, 0, 0, ship.width, ship.height);
            
            ctx.restore();
            
            // Kotak input hanya terlihat selama permainan normal.
            // Begitu tembakan pencapai target selesai dan fase kemenangan dimulai,
            // pesawat tampil bersih tanpa kotak input sampai keluar dari layar.
            if (gameState === 'PLAYING') {
                ctx.save();
                ctx.translate(ship.x, ship.y + 35); // Posisi box input di bawah pesawat
                ctx.fillStyle = '#1f2833'; // background rect
                ctx.fillRect(-30, -15, 60, 30);
                
                ctx.strokeStyle = '#66fcf1';
                ctx.lineWidth = 2;
                ctx.strokeRect(-30, -15, 60, 30);
                
                ctx.fillStyle = '#66fcf1';
                ctx.font = 'bold 20px Roboto';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Blinking cursor effect if empty
                let displayText = currentInput;
                if (displayText === "" && Math.floor(Date.now() / 500) % 2 === 0) {
                    displayText = "_";
                }
                ctx.fillText(displayText, 0, 0);
                ctx.restore();
            }
        }

        function drawBackground() {
            // Simple starry background
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, viewWidth, viewHeight);
            
            // Draw some stars (static for performance)
            // Ideally we'd have a starfield object, let's just do static dots for now
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            // We use a fixed seed concept or just draw a few every frame based on position
            // A better way is an offscreen canvas or CSS. Since we added a CSS starfield div, let's use that instead for pure static stars.
            // Wait, CSS starfield is empty. Let's populate it via JS once.
        }

        // Initialize CSS Stars
        function initStars() {
            const starfield = document.getElementById('starfield');
            starfield.innerHTML = ''; // clear
            for (let i = 0; i < 100; i++) {
                let star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.backgroundColor = 'white';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random();
                starfield.appendChild(star);
            }
        }
        initStars();

        function update(dt) {
            const isPlaying = gameState === 'PLAYING';
            const isVictoryPending = gameState === 'VICTORY_PENDING';
            const isVictoryClear = gameState === 'VICTORY_CLEAR';
            const isVictoryExit = gameState === 'VICTORY_EXIT';
            if (!isPlaying && !isVictoryPending && !isVictoryClear && !isVictoryExit) return;

            if (isPlaying) {
                timeElapsed += dt * 1000;
                meteorSpawnTimer += dt * 1000;

                // Spawn meteors sesuai Level Kepadatan yang dipilih.
                // Kepadatan hanya mengatur frekuensi/jumlah meteor, bukan kecepatan jatuh.
                if (meteorSpawnTimer >= meteorSpawnInterval) {
                    if (meteors.length < maxMeteorsOnScreen) {
                        meteors.push(new Meteor());
                    }
                    meteorSpawnTimer = 0;
                }
            }

            // Meteor yang sudah ada tetap bergerak saat jeda kemenangan dan final attack berlangsung.
            meteors.forEach(m => m.update(dt));
            
            lasers.forEach(l => {
                const hit = l.update(dt);
                if (hit && l.target && !l.target.dead) {
                    const target = l.target;
                    explosions.push(new Explosion(target.x, target.y));
                    playSfx(target.isAlien ? 'alienExplosion' : 'explosion');

                    // Hanya tembakan pemain yang mengenai target saat fase PLAYING yang menambah skor.
                    // Setelah target tercapai, laser lama yang kebetulan masih terbang tidak menambah skor lagi.
                    const playerScoringHit = l.awardsPoint && gameState === 'PLAYING';
                    if (playerScoringHit) {
                        score += 10;
                        scoreDisplay.innerText = score;
                        scorePopups.push(new FloatingScore(target.x, target.y - 8, '+10'));
                    }

                    // Bonus alien hanya dihitung dari tembakan pemain, bukan salvo otomatis kemenangan.
                    if (playerScoringHit && target.isAlien && !target.alienKillCounted) {
                        target.alienKillCounted = true;
                        awardAlienLifeBonus(target);
                    }

                    target.dead = true;

                    // Jika ledakan ini menghasilkan skor target, tunggu ledakan normal selesai terlihat
                    // sebelum meluncurkan salvo otomatis ke semua target yang tersisa.
                    if (playerScoringHit && score >= targetScore) {
                        beginVictoryPending();
                    }
                }
            });
            
            explosions.forEach(e => e.update(dt));
            scorePopups.forEach(p => p.update(dt));

            // Collision and Cleanup
            lasers = lasers.filter(l => l.active);
            explosions = explosions.filter(e => e.active);
            scorePopups = scorePopups.filter(p => p.active);

            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                
                // If hit by laser
                if (m.dead) {
                    meteors.splice(i, 1);
                    if (selectedMeteor === m) selectedMeteor = null;
                    continue;
                }

                // Pada final attack meteor tetap bergerak sampai terkena laser;
                // benturan ke pesawat tidak lagi mengurangi nyawa atau mengakhiri permainan.
                if (gameState === 'PLAYING' && m.y + m.radius >= ship.y - ship.height/2) {
                    // Impact!
                    explosions.push(new Explosion(m.x, m.y));
                    playSfx('lifeLost');
                    meteors.splice(i, 1);
                    if (selectedMeteor === m) selectedMeteor = null;
                    
                    lives--;
                    livesDisplay.innerText = lives;
                    
                    if (lives <= 0 && gameState === 'PLAYING') {
                        if (score >= 20) {
                            // Skor menjadi cadangan nyawa: bayar 20 poin untuk kembali memiliki 1 nyawa.
                            score -= 20;
                            lives = 1;
                            scoreDisplay.innerText = score;
                            livesDisplay.innerText = lives;
                            playSfx('rescue');
                            showGameToast('−20 SKOR • NYAWA DISELAMATKAN!', 'rescue');
                            livesHudItem.classList.remove('life-gain-pulse');
                            void livesHudItem.offsetWidth;
                            livesHudItem.classList.add('life-gain-pulse');
                        } else {
                            endGame();
                            break;
                        }
                    }
                }
            }

            if (isVictoryPending) {
                ship.angle = 0;
                victoryPendingTimer = Math.max(0, victoryPendingTimer - dt);
                if (victoryPendingTimer <= 0 && gameState === 'VICTORY_PENDING') {
                    beginVictoryClear();
                }
                return;
            }

            if (isVictoryClear) {
                // Selama final attack, pesawat selalu menghadap lurus ke atas.
                ship.angle = 0;

                // Sesudah semua musuh dan ledakannya benar-benar selesai,
                // pesawat pergi terlebih dahulu sebelum layar MENANG ditampilkan.
                if (meteors.length === 0 && explosions.length === 0) {
                    beginVictoryExit();
                }
                return;
            }

            if (isVictoryExit) {
                ship.angle = 0;
                ship.y -= 270 * dt;

                // Tunggu sampai seluruh badan pesawat benar-benar keluar dari bagian atas layar.
                if (ship.y + ship.height / 2 < -8) {
                    winGame();
                }
                return;
            }
            
            // Ensure ship angle points towards selected meteor if moving
            if (selectedMeteor && !selectedMeteor.isTargeted) {
                const dx = selectedMeteor.x - ship.x;
                const dy = selectedMeteor.y - ship.y;
                ship.angle = Math.atan2(dy, dx) + Math.PI / 2;
            } else if (!selectedMeteor) {
                // Slowly return to center pointing up
                const targetAngle = 0;
                ship.angle += (targetAngle - ship.angle) * 0.1;
            }
        }

        function draw() {
            // Clear canvas (actually we fill black in drawBackground)
            ctx.clearRect(0, 0, viewWidth, viewHeight);
            // Background handled by CSS mainly, but we can clear canvas
            
            meteors.forEach(m => m.draw(ctx));
            lasers.forEach(l => l.draw(ctx));
            explosions.forEach(e => e.draw(ctx));
            scorePopups.forEach(p => p.draw(ctx));
            drawShip(ctx);
        }

        function gameLoop(timestamp) {
            if (!['PLAYING', 'VICTORY_PENDING', 'VICTORY_CLEAR', 'VICTORY_EXIT'].includes(gameState)) return;

            let dt = (timestamp - lastTime) / 1000;
            // Cap dt to prevent huge jumps if tab is inactive
            if (dt > 0.1) dt = 0.1; 
            lastTime = timestamp;

            update(dt);
            draw();

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            // Apply selected settings
            currentMathLevel = parseInt(mathLevelSelect.value);
            currentOperation = document.querySelector('input[name="operation-mode"]:checked').value;
            const level = parseInt(levelSlider.value);
            currentSpeedMultiplier = level / 10; // Mengubah 1-10 menjadi 0.1 - 1.0 (10% - 100%)
            currentDensityLevel = parseInt(densitySlider.value);
            const densityConfig = densityConfigs[currentDensityLevel];
            meteorSpawnInterval = densityConfig.interval;
            maxMeteorsOnScreen = densityConfig.maxMeteors;
            targetScore = selectedTargetScore;

            // Reset Stats
            pendingWin = false;
            victoryPendingTimer = 0;
            clearConfetti();
            stopMusic();
            score = 0;
            lives = 3;
            alienKills = 0;
            timeElapsed = 0;
            meteorSpawnTimer = meteorSpawnInterval; // spawn one immediately
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            targetScoreHud.innerText = targetScore;
            
            // Reset Entities
            meteors = [];
            lasers = [];
            explosions = [];
            scorePopups = [];
            currentInput = "";
            selectedMeteor = null;
            ship.angle = 0;
            
            // UI changes
            screens.classList.add('hidden');
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            numpadContainer.classList.remove('hidden');
            
            // Layout fix
            resizeCanvas();

            gameState = 'PLAYING';
            ensureAudio();
            startMusic();
            lastTime = performance.now();
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            if (gameState !== 'PLAYING') return;
            gameState = 'GAMEOVER';
            pendingWin = false;
            stopMusic();
            clearConfetti();
            cancelAnimationFrame(animationId);
            playSfx('lose');
            
            // Show Game Over UI
            uiLayer.classList.add('hidden');
            numpadContainer.classList.add('hidden');
            screens.classList.remove('hidden');
            startScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            
            finalScoreDisplay.innerText = `Skor Akhir: ${score}`;
        }

        function winGame() {
            if (!['PLAYING', 'VICTORY_PENDING', 'VICTORY_CLEAR', 'VICTORY_EXIT'].includes(gameState)) return;
            gameState = 'WIN';
            pendingWin = false;
            stopMusic();
            cancelAnimationFrame(animationId);
            playSfx('win');

            uiLayer.classList.add('hidden');
            numpadContainer.classList.add('hidden');
            screens.classList.remove('hidden');
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            winScreen.classList.remove('hidden');

            winScoreDisplay.innerText = `Skor Akhir: ${score} — Target ${targetScore} tercapai!`;
            launchConfetti();
        }

        function goHome() {
            if (animationId) cancelAnimationFrame(animationId);
            gameState = 'START';
            pendingWin = false;
            victoryPendingTimer = 0;
            stopMusic();
            clearConfetti();
            meteors = [];
            lasers = [];
            explosions = [];
            scorePopups = [];
            currentInput = "";
            selectedMeteor = null;

            uiLayer.classList.add('hidden');
            numpadContainer.classList.add('hidden');
            screens.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            resizeCanvas();
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                // Fullscreen can be blocked by browser/device policy; game remains usable.
            }
        }

        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.setAttribute('aria-label', document.fullscreenElement ? 'Keluar layar penuh' : 'Layar penuh');
            setTimeout(resizeCanvas, 50);
        });

        // Event Listeners for Start/Restart and right-card controls
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        winRestartBtn.addEventListener('click', startGame);
        homeBtn.addEventListener('click', goHome);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        soundBtn.addEventListener('click', toggleSound);
        continueBtn.addEventListener('click', continueFromSplash);

        // Mulai preloader setelah seluruh elemen halaman siap.
        preloadGameAssets();

    </script>
</body>
</html>
