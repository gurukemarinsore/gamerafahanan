"}, {"text": "Bagaimana suhu susunya?", "answer": "Hangat."}, {"text": "Ke wadah apa susu dituangkan?", "answer": "Ke gelas."}]}, {"code": "A7", "level": 1, "title": "Layang-Layang", "story": "Danu bermain layang-layang di lapangan.", "questions": [{"text": "Siapa yang bermain?", "answer": "Danu."}, {"text": "Apa yang dimainkan Danu?", "answer": "Layang-layang."}, {"text": "Di mana Danu bermain?", "answer": "Di lapangan."}, {"text": "Apa yang dilakukan Danu di lapangan?", "answer": "Bermain layang-layang."}]}, {"code": "A8", "level": 1, "title": "Topi Hijau", "story": "Rara memakai topi hijau ke pantai.", "questions": [{"text": "Siapa yang memakai topi?", "answer": "Rara."}, {"text": "Apa yang dipakai Rara?", "answer": "Topi."}, {"text": "Apa warna topinya?", "answer": "Hijau."}, {"text": "Ke mana Rara pergi?", "answer": "Ke pantai."}]}, {"code": "A9", "level": 1, "title": "Wortel Kelinci", "story": "Kelinci cokelat makan wortel di kandang.", "questions": [{"text": "Hewan apa yang sedang makan?", "answer": "Kelinci."}, {"text": "Apa warna kelincinya?", "answer": "Cokelat."}, {"text": "Apa yang dimakan kelinci?", "answer": "Wortel."}, {"text": "Di mana kelinci makan?", "answer": "Di kandang."}]}, {"code": "A10", "level": 1, "title": "Menyiram Bunga", "story": "Fajar menyiram bunga di halaman pada pagi hari.", "questions": [{"text": "Siapa yang menyiram bunga?", "answer": "Fajar."}, {"text": "Apa yang disiram Fajar?", "answer": "Bunga."}, {"text": "Di mana bunga itu berada?", "answer": "Di halaman."}, {"text": "Kapan Fajar menyiram bunga?", "answer": "Pagi hari."}]}, {"code": "B1", "level": 2, "title": "Bekal ke Sekolah", "story": "Pagi hari, Bimo membawa dua roti dan satu botol air ke sekolah. Tasnya berwarna biru.", "questions": [{"text": "Kapan Bimo pergi ke sekolah?", "answer": "Pagi hari."}, {"text": "Berapa roti yang dibawa Bimo?", "answer": "Dua roti."}, {"text": "Apa yang dibawa selain roti?", "answer": "Satu botol air."}, {"text": "Apa warna tas Bimo?", "answer": "Biru."}]}, {"code": "B2", "level": 2, "title": "Belanja Buah", "story": "Ibu membeli tiga apel merah dan dua pisang di pasar. Buah itu dibawa dalam keranjang.", "questions": [{"text": "Siapa yang membeli buah?", "answer": "Ibu."}, {"text": "Berapa apel yang dibeli?", "answer": "Tiga apel."}, {"text": "Apa warna apelnya?", "answer": "Merah."}, {"text": "Dengan wadah apa Ibu membawa buah?", "answer": "Keranjang."}]}, {"code": "B3", "level": 2, "title": "Pensil untuk Adik", "story": "Sore hari, Nisa memberikan dua pensil kuning kepada adiknya di ruang tamu.", "questions": [{"text": "Kapan Nisa memberikan pensil?", "answer": "Sore hari."}, {"text": "Berapa pensil yang diberikan?", "answer": "Dua pensil."}, {"text": "Apa warna pensilnya?", "answer": "Kuning."}, {"text": "Kepada siapa Nisa memberikan pensil?", "answer": "Adiknya."}]}, {"code": "B4", "level": 2, "title": "Bermain Bersama", "story": "Danu dan Fajar bermain bola di lapangan pada sore hari. Bola mereka berwarna putih.", "questions": [{"text": "Siapa dua anak yang bermain bola?", "answer": "Danu dan Fajar."}, {"text": "Apa yang mereka mainkan?", "answer": "Bola."}, {"text": "Kapan mereka bermain?", "answer": "Sore hari."}, {"text": "Apa warna bolanya?", "answer": "Putih."}]}, {"code": "B5", "level": 2, "title": "Kue Buatan Ibu", "story": "Ibu membuat empat kue cokelat di dapur. Kue itu diletakkan di piring putih untuk Ayah.", "questions": [{"text": "Berapa kue yang dibuat Ibu?", "answer": "Empat kue."}, {"text": "Apa rasa kuenya?", "answer": "Cokelat."}, {"text": "Apa warna piring kuenya?", "answer": "Putih."}, {"text": "Untuk siapa kue itu dibuat?", "answer": "Ayah."}]}, {"code": "B6", "level": 2, "title": "Membaca di Perpustakaan", "story": "Rara membaca buku tentang hewan di perpustakaan. Ia duduk di kursi hijau bersama Lala.", "questions": [{"text": "Tentang apa buku yang dibaca Rara?", "answer": "Hewan."}, {"text": "Di mana Rara membaca?", "answer": "Di perpustakaan."}, {"text": "Apa warna kursi Rara?", "answer": "Hijau."}, {"text": "Siapa yang bersama Rara?", "answer": "Lala."}]}, {"code": "B7", "level": 2, "title": "Ikan di Akuarium", "story": "Bimo melihat tiga ikan kecil di akuarium ruang tamu. Dua ikan berwarna merah dan satu berwarna kuning.", "questions": [{"text": "Berapa jumlah semua ikan?", "answer": "Tiga ikan."}, {"text": "Berapa ikan yang berwarna merah?", "answer": "Dua ikan."}, {"text": "Apa warna ikan yang hanya ada satu?", "answer": "Kuning."}, {"text": "Di ruangan mana akuarium berada?", "answer": "Di ruang tamu."}]}, {"code": "B8", "level": 2, "title": "Piknik di Pantai", "story": "Pada hari Minggu, keluarga Nisa pergi ke pantai dengan mobil. Ayah membawa tikar dan Ibu membawa nasi.", "questions": [{"text": "Pada hari apa keluarga Nisa pergi ke pantai?", "answer": "Minggu."}, {"text": "Dengan apa mereka pergi?", "answer": "Mobil."}, {"text": "Apa yang dibawa Ayah?", "answer": "Tikar."}, {"text": "Apa yang dibawa Ibu?", "answer": "Nasi."}]}, {"code": "B9", "level": 2, "title": "Menanam Bunga", "story": "Lala menanam dua bunga kuning dalam pot merah. Ia meletakkan pot itu di depan rumah.", "questions": [{"text": "Siapa yang menanam bunga?", "answer": "Lala."}, {"text": "Berapa bunga yang ditanam?", "answer": "Dua bunga."}, {"text": "Apa warna potnya?", "answer": "Merah."}, {"text": "Di mana pot diletakkan?", "answer": "Di depan rumah."}]}, {"code": "B10", "level": 2, "title": "Hadiah Ulang Tahun", "story": "Pada ulang tahunnya, Fajar menerima buku dari Ayah dan bola dari Ibu. Bola itu berwarna biru.", "questions": [{"text": "Pada acara apa Fajar menerima hadiah?", "answer": "Ulang tahunnya."}, {"text": "Siapa yang memberikan buku?", "answer": "Ayah."}, {"text": "Apa hadiah dari Ibu?", "answer": "Bola."}, {"text": "Apa warna bola hadiah Fajar?", "answer": "Biru."}]}, {"code": "C1", "level": 3, "title": "Pagi Lala", "story": "Setelah bangun tidur, Lala merapikan tempat tidur. Kemudian ia mandi. Terakhir, ia sarapan.", "questions": [{"text": "Apa <div class="illustration" aria-hidden="true"><svg viewBox="0 0 380 280"><ellipse cx="190" cy="245" rx="132" ry="14" fill="#dce9fa"/><circle cx="210" cy="130" r="113" fill="#e4efff"/><path d="M42 59l7-19 7 19 20 6-20 7-7 19-7-19-20-7z" fill="#ffd34e"/><path d="M314 40l5-12 5 12 13 5-13 5-5 12-5-12-12-5z" fill="#1565d8"/><g transform="rotate(-12 178 156)"><rect x="81" y="53" width="183" height="192" rx="19" fill="#1565d8"/><rect x="90" y="44" width="183" height="192" rx="19" fill="#ffffff" stroke="#c4daf8" stroke-width="2"/><rect x="107" y="61" width="45" height="28" rx="8" fill="#e4efff"/><text x="118" y="81" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565d8">A1</text><text x="239" y="82" font-family="sans-serif" font-size="23" fill="#e4ad21">★</text><rect x="111" y="112" width="140" height="7" rx="3.5" fill="#d6e6fd"/><rect x="111" y="130" width="116" height="7" rx="3.5" fill="#d6e6fd"/><rect x="111" y="148" width="131" height="7" rx="3.5" fill="#d6e6fd"/><path d="M107 183q31-10 58 1v31q-27-10-58 0z" fill="#f4b832"/><path d="M165 184q27-11 59-1v32q-32-10-59 0z" fill="#ffe48c"/><path d="M165 184v31" stroke="#ffffff" stroke-width="2"/></g><circle cx="308" cy="213" r="26" fill="#ffe08a"/><text x="297" y="222" font-family="sans-serif" font-size="26" fill="#1565d8">✓</text></svg><span class="floating">Sedikit demi sedikit, makin paham ✦</span></div></section>
<div class="section-head"><h2>1. Pilih cara belajar</h2><span>Gunakan kartu yang sama dalam dua gaya</span></div><div class="modes">
<button class="mode ${state.mode==='listen'?'selected':''}" data-action="mode" data-value="listen" aria-pressed="${state.mode==='listen'}"><span class="mode-icon" aria-hidden="true">◖♪</span><span><strong>Dibacakan Orang Tua</strong><small>Orang tua membaca · Anak menjawab lisan</small></span><span class="radio" aria-hidden="true"></span></button>
<button class="mode ${state.mode==='read'?'selected':''}" data-action="mode" data-value="read" aria-pressed="${state.mode==='read'}"><span class="mode-icon" aria-hidden="true">▤</span><span><strong>Membaca Mandiri</strong><small>Anak membaca · Menjawab di kertas</small></span><span class="radio" aria-hidden="true"></span></button></div>
<div class="section-head"><h2>2. Pilih tingkat tantangan</h2><span>Mulai dari yang terasa nyaman</span></div><div class="levels">${LEVELS.map((l,i)=>`<button class="level ${state.level===i+1?'selected':''}" style="${styleFor(i+1)}" data-action="level" data-value="${i+1}" aria-pressed="${state.level===i+1}"><div class="level-top"><span class="letter">${l.letter}</span><small>${doneCount(i+1)}/10 selesai</small></div><div class="stars" aria-label="${i+1} bintang">${stars(i+1)}</div><strong>${l.name}</strong><small>${l.focus}</small></button>`).join('')}</div>
<section class="setup" aria-label="Pengaturan latihan"><div class="field"><label for="order">Urutan kartu</label><select id="order"><option value="ordered" ${state.order==='ordered'?'selected':''}>Berurutan</option><option value="random" ${state.order==='random'?'selected':''}>Acak kartu</option><option value="single" ${state.order==='single'?'selected':''}>Satu kartu pilihan</option></select></div><div class="field" ${state.order==='random'?'hidden':''}><label for="start-card">${state.order==='single'?'Pilih kartu':'Mulai dari kartu'}</label><select id="start-card">${CARDS.filter(c=>c.level===state.level).map(c=>`<option value="${c.code}" ${c.code===state.start?'selected':''}>${c.code} · ${esc(c.title)}</option>`).join('')}</select></div><button class="primary" data-action="begin">Mulai Belajar →</button></section>
<p class="hint">${state.mode==='listen'?'Siapkan layar untuk orang tua. Bacakan cerita terlebih dahulu, lalu tanyakan satu per satu.':'Siapkan kertas dan pensil. Tulis kode kartu beserta jawaban nomor 1–4.'} Kunci tersedia di menu Lihat Soal.</p><p class="hint">${storageOK?'Tanda selesai disimpan pada browser dan perangkat ini.':'Penyimpanan browser tidak tersedia. Tanda selesai hanya berlaku selama halaman ini terbuka.'} <button class="quiet" style="padding:3px 8px;min-height:28px;font-size:11px;margin-left:8px" data-action="reset">Hapus tanda selesai</button></p>`;}
function catalogHTML(){return `<section class="catalog-heading"><p class="eyebrow">Katalog untuk orang tua</p><h1>Cari kartu. Periksa jawaban.</h1><p>Pilih kode yang ditulis anak di kertas, lalu buka kunci jawabannya.</p></section><div class="catalog-tools"><div class="chips" aria-label="Filter level"><button class="chip ${state.filter===0?'active':''}" data-action="filter" data-value="0" aria-pressed="${state.filter===0}">Semua</button>${LEVELS.map((l,i)=>`<button class="chip ${state.filter===i+1?'active':''}" data-action="filter" data-value="${i+1}" aria-pressed="${state.filter===i+1}">${l.letter} · ${stars(i+1)}</button>`).join('')}</div><input id="search" type="search" placeholder="Cari kode atau judul, misalnya B5" aria-label="Cari kode atau judul kartu" value="${esc(state.query)}"></div><div class="catalog-count" id="catalog-count" role="status"></div><div class="catalog-grid" id="catalog-grid"></div>`;}
function filteredCards(){const q=state.query.trim().toLocaleLowerCase('id');return CARDS.filter(c=>(state.filter===0||c.level===state.filter)&&(!q||c.code.toLowerCase()===q||c.title.toLocaleLowerCase('id').includes(q)));}
function fillCatalog(){const cards=filteredCards();document.getElementById('catalog-count').textContent=`${cards.length} kartu ditemukan · Isi dan kode setiap kartu tetap`;
 document.getElementById('catalog-grid').innerHTML=cards.length?cards.map(c=>`<button class="catalog-card" style="${styleFor(c.level)}" data-action="open" data-value="${c.code}" aria-label="Lihat soal ${c.code}: ${esc(c.title)}"><span class="meta"><span class="code-badge">${c.code}</span><span class="stars" aria-label="${c.level} bintang">${stars(c.level)}</span></span><h3>${esc(c.title)}</h3><p>${esc(c.story)}</p><span class="card-link">4 pertanyaan · Lihat kartu →</span></button>`).join(''):`<div class="empty">Kartu tidak ditemukan. Coba kode lengkap seperti A1 atau E10, atau pilih filter Semua.</div>`;}
function readerHTML(){const c=state.deck[state.index];if(!c)return '<p>Kartu belum dipilih.</p>';const review=state.origin==='catalog';const listening=state.mode==='listen';const canKeys=review||listening;const isDone=done(c);return `<div class="reader-page" style="${styleFor(c.level)}">
<div class="reader-header"><button class="quiet" data-action="back">← ${review?'Katalog soal':'Pilih latihan'}</button><span class="reader-top">${review?'Pratinjau kartu':`Kartu <strong>${state.index+1}</strong> dari ${state.deck.length}`}</span></div>
${review?'<div class="review-note">Halaman pemeriksaan orang tua. Kunci dapat dibuka di bawah. Gunakan “Kerjakan Kartu Ini” untuk halaman latihan anak.</div>':`<div class="reading-mode"><span class="pill current">${listening?'Dibacakan Orang Tua':'Membaca Mandiri'}</span><span class="pill">${listening?'Jawab secara lisan':'Tulis jawaban di kertas'}</span>${isDone?'<span class="pill">✓ Sudah ditandai selesai</span>':''}</div><div class="progress-track" aria-label="Posisi kartu ${state.index+1} dari ${state.deck.length}"><div class="progress-fill" style="width:${100*(state.index+1)/state.deck.length}%"></div></div>`}
${state.finished?`<section class="complete-panel" role="status"><div style="font-size:35px;color:#a46b08">✦</div><h2>Latihan selesai!</h2><p>Kamu sudah sampai di kartu terakhir. Cocokkan jawaban bersama orang tua, lalu coba cerita lainnya.</p><button class="primary" data-action="home">Pilih Latihan Lagi</button></section>`:''}
<article class="card-sheet"><div class="sheet-header"><span class="code-badge">${c.code}</span><div class="sheet-title"><h1>${esc(c.title)}</h1><small>${LEVELS[c.level-1].name}</small></div><span class="stars" aria-label="Tingkat ${c.level} bintang">${stars(c.level)}</span></div><div class="print-only">Nama: ____________________ &nbsp; Tanggal: ____________________</div>
<section class="story-area"><p class="label">${listening&&!review?'Cerita · Bacakan terlebih dahulu':'Cerita'}</p>${state.storyVisible?`<p class="story-text">${esc(c.story)}</p>`:'<div class="story-cover">Cerita disembunyikan.<br>Ingat kembali cerita yang sudah didengar.</div>'}${listening&&!review?`<div class="story-toggle"><button class="quiet" data-action="toggle-story">${state.storyVisible?'Sembunyikan Cerita':'Tampilkan Cerita'}</button></div>`:''}</section>
<section class="questions"><p class="label">Pertanyaan · ${listening&&!review?'Tanyakan satu per satu':'Jawab dengan kata-katamu'}</p><div class="question-grid">${c.questions.map((q,i)=>`<div class="question"><span class="q-number">${i+1}</span><div><p>${esc(q.text)}</p><small>${c.code}-${i+1}</small>${state.answers&&canKeys?`<div class="answer"><strong>Kunci / jawaban yang diterima</strong>${esc(q.answer)}</div>`:''}</div></div>`).join('')}</div></section>
<div class="paper-note">${listening&&!review?'Anak menjawab secara lisan. Jawaban dengan makna yang sama dapat diterima.':`Di kertas, tulis <strong>Kode: ${c.code}</strong>, kemudian jawaban nomor 1, 2, 3, dan 4.`}</div></article>
<div class="reader-actions"><div class="action-group">${canKeys?`<button class="secondary" data-action="keys" aria-expanded="${state.answers}">${state.answers?'Tutup Kunci':'Lihat Kunci'}</button>`:''}${review?'<button class="primary" data-action="work-card">Kerjakan Kartu Ini →</button>':`<button class="${isDone?'quiet':'primary'}" data-action="done">${isDone?'✓ Selesai · Batalkan tanda':'Tandai Selesai'}</button>`}<button class="quiet" data-action="print">Cetak ${state.answers?'dengan Kunci':'Kartu'}</button></div>${!review?`<div class="pager"><button class="quiet" data-action="prev" ${state.index===0?'disabled':''}>← Sebelumnya</button><button class="secondary" data-action="next">${state.index===state.deck.length-1?'Akhiri Latihan ✓':'Berikutnya →'}</button></div>`:''}</div>
${!review?`<p class="hint print-hint">${listening?'Setelah anak menjawab, buka kunci untuk mencocokkan.':'Untuk memeriksa, orang tua membuka menu Lihat Soal dan mencari kode '+c.code+'.'} “Selesai” menandai kartu yang sudah dikerjakan, bukan nilai jawaban.</p>`:'<p class="hint print-hint">Saat mencetak, kunci ikut tercetak hanya jika sedang dibuka. Tutup kunci untuk mencetak lembar soal.</p>'}</div>`;}
function shuffle(cards){const a=[...cards];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(){let cards=CARDS.filter(c=>c.level===state.level);if(state.order==='random')cards=shuffle(cards);else if(state.order==='single')cards=cards.filter(c=>c.code===state.start);else cards=cards.slice(Math.max(0,cards.findIndex(c=>c.code===state.start)));state.deck=cards;state.index=0;state.origin='home';state.storyVisible=true;navigate('reader');}
function step(delta){state.index=Math.max(0,Math.min(state.deck.length-1,state.index+delta));state.answers=false;state.storyVisible=true;state.finished=false;render();window.scrollTo({top:0,behavior:'instant'});}

function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function syncFullscreen(){
 const active=fullscreenActive();
 const button=document.getElementById('fullscreen-button');
 const label=active?'Keluar dari layar penuh':'Layar penuh';
 button.setAttribute('aria-pressed',String(active));
 button.setAttribute('aria-label',label);
 button.setAttribute('title',label);
 document.getElementById('fullscreen-icon').setAttribute('d',active?'M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3':'M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5');
}
async function toggleFullscreen(){
 try{
  if(fullscreenActive()){
   const exit=document.exitFullscreen||document.webkitExitFullscreen;
   if(!exit){notify('Browser ini tidak mendukung keluar dari layar penuh melalui tombol.');return;}
   await exit.call(document);
  }else{
   const target=document.documentElement;
   const request=target.requestFullscreen||target.webkitRequestFullscreen;
   if(!request){notify('Layar penuh belum didukung oleh browser ini.');return;}
   await request.call(target);
  }
  syncFullscreen();
 }catch(e){notify('Layar penuh tidak dapat dibuka. Coba gunakan browser atau tab biasa.');syncFullscreen();}
}
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value;
switch(action){
case 'theme':toggleTheme();break;
case 'fullscreen':toggleFullscreen();break;
case 'home':navigate('home');break;
case 'catalog':navigate('catalog');break;
case 'mode':state.mode=v;render();break;
case 'level':state.level=Number(v);state.start=LEVELS[state.level-1].letter+'1';render();break;
case 'begin':begin();break;
case 'filter':state.filter=Number(v);render();break;
case 'open':{const c=CARDS.find(x=>x.code===v);if(c){state.deck=[c];state.index=0;state.origin='catalog';state.storyVisible=true;navigate('reader');}break;}
case 'back':navigate(state.origin==='catalog'?'catalog':'home');break;
case 'keys':if(state.origin==='catalog'||state.mode==='listen'){state.answers=!state.answers;render();}break;
case 'toggle-story':state.storyVisible=!state.storyVisible;render();break;
case 'work-card':{const c=state.deck[state.index];state.level=c.level;state.start=c.code;state.origin='home';state.storyVisible=true;state.index=0;state.deck=[c];navigate('reader');break;}
case 'done':{const c=state.deck[state.index];progress[`${state.mode}:${c.code}`]=!done(c);const saved=saveProgress();render();notify(saved?'Tanda selesai diperbarui.':'Tanda diperbarui untuk sesi ini. Penyimpanan browser tidak tersedia.');break;}
case 'prev':step(-1);break;
case 'next':if(state.index===state.deck.length-1){state.finished=true;state.answers=false;render();window.scrollTo({top:0,behavior:'instant'});}else step(1);break;
case 'print':{const wasVisible=state.storyVisible;state.storyVisible=true;render();window.print();state.storyVisible=wasVisible;render();break;}
case 'reset':document.getElementById('reset-dialog').showModal();break;
case 'cancel-reset':document.getElementById('reset-dialog').close();break;
case 'confirm-reset':progress={};saveProgress();document.getElementById('reset-dialog').close();render();notify('Tanda selesai dihapus.');break;
}});
document.addEventListener('change',e=>{if(e.target.id==='order'){state.order=e.target.value;render();}else if(e.target.id==='start-card'){state.start=e.target.value;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;fillCatalog();}});
applyTheme();
render();
syncFullscreen();
</script>
</body></html>
