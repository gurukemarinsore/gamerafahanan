<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Berhitung Rafa &amp; Hanan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900;1000&display=swap');

        :root {
            --primary-color: #2563eb;
            --secondary-color: #facc15;
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --muted-color: #64748b;
            --card-bg: #ffffff;
            --soft-card: #ffffff;
            --border-color: #dbe4f0;
            --panel-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            --button-shadow: 0 10px 22px rgba(37, 99, 235, 0.16);
            --danger-bg: #fee2e2;
            --danger-text: #dc2626;
            --success-color: #16a34a;
            --input-bg: #ffffff;
            --surface-alt: #f8fafc;
            --brand-text: #ffffff;
            --step-accent-bg: #fef3c7;
        }

        body[data-theme="dark"] {
            --primary-color: #60a5fa;
            --secondary-color: #fde047;
            --bg-color: #090f1a;
            --text-color: #e5eefc;
            --muted-color: #9fb0c8;
            --card-bg: #0f172a;
            --soft-card: #0f172a;
            --border-color: #22304a;
            --panel-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
            --button-shadow: 0 10px 24px rgba(96, 165, 250, 0.18);
            --danger-bg: rgba(239, 68, 68, 0.18);
            --danger-text: #fca5a5;
            --success-color: #86efac;
            --input-bg: #111c31;
            --surface-alt: #111c31;
            --brand-text: #08111f;
            --step-accent-bg: #2a2410;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Nunito", "Comic Sans MS", system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            transition: background 0.25s ease, color 0.25s ease;
        }

        #app-container {
            width: min(96vw, 980px);
            height: min(94dvh, 540px);
            min-height: 470px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            box-shadow: var(--panel-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header,
        .screen,
        .confetti-layer {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px 10px;
            align-items: center;
            height: 64px;
            flex-shrink: 0;
        }

        .header-left,
        .header-right {
            display: flex;
            gap: 9px;
            align-items: center;
        }

        .brand-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            color: var(--text-color);
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .brand-text {
            font-size: 0.98rem;
            white-space: nowrap;
        }

        .btn-home,
        .btn-fullscreen,
        .theme-toggle {
            width: 38px;
            min-width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .btn-home {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: var(--button-shadow);
        }

        .btn-fullscreen,
        .theme-toggle {
            background: var(--soft-card);
            color: var(--text-color);
        }

        .input-mode-toggle {
            width: 38px;
            min-width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--soft-card);
            color: var(--primary-color);
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .input-mode-toggle:hover {
            transform: translateY(-1px);
        }

        .input-mode-toggle:active {
            transform: scale(0.96);
        }

        .btn-home:hover,
        .btn-fullscreen:hover,
        .theme-toggle:hover,
        .step-btn:hover,
        .btn-start:hover,
        .btn-restart:hover {
            transform: translateY(-1px);
        }

        .btn-home:active,
        .btn-fullscreen:active,
        .theme-toggle:active,
        .step-btn:active,
        .btn-start:active,
        .btn-restart:active,
        .btn-num:active {
            transform: scale(0.96);
        }

        .icon-line {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex: 0 0 auto;
        }

        .theme-toggle > span {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            line-height: 0;
        }

        .question-counter,
        .timer {
            width: 104px;
            min-width: 104px;
            height: 38px;
            place-items: center;
            background: var(--soft-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.12rem;
            font-weight: 1000;
            padding: 0 12px;
        }

        .question-counter {
            display: none;
            color: var(--text-color);
        }

        .timer {
            display: grid;
            font-family: inherit;
            color: var(--primary-color);
        }

        .timer.critical {
            color: var(--danger-text);
        }

        .lives-display {
            height: 38px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 7px;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            background: var(--soft-card);
        }

        .heart-slot {
            width: 22px;
            height: 22px;
            position: relative;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .life-heart {
            width: 21px;
            height: 21px;
            display: block;
            fill: #ef4444;
            stroke: #dc2626;
            stroke-width: 1.35;
            transform-origin: center;
            filter: drop-shadow(0 2px 3px rgba(239, 68, 68, 0.18));
        }

        .heart-slot.lost .life-heart {
            opacity: 1;
            transform: scale(1);
            fill: #ffffff;
            stroke: #94a3b8;
            stroke-width: 1.35;
            filter: none;
        }

        .heart-slot.exploding .life-heart {
            animation: heartBurst 0.52s ease-out forwards;
        }

        .heart-slot.exploding::before,
        .heart-slot.exploding::after {
            content: "";
            position: absolute;
            inset: 50%;
            width: 6px;
            height: 6px;
            margin: -3px;
            border-radius: 999px;
            background: #ef4444;
            pointer-events: none;
            animation: heartSpark 0.52s ease-out forwards;
        }

        .heart-slot.exploding::after {
            background: #facc15;
            animation-name: heartSparkAlt;
        }

        @keyframes heartBurst {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            35% { opacity: 1; transform: scale(1.38) rotate(-8deg); }
            100% { opacity: 0; transform: scale(0.08) rotate(20deg); }
        }

        @keyframes heartSpark {
            0% { opacity: 0; box-shadow: 0 0 0 #ef4444; transform: scale(0.4); }
            35% { opacity: 1; }
            100% {
                opacity: 0;
                transform: scale(0.9);
                box-shadow:
                    0 -18px 0 #ef4444,
                    16px -10px 0 #ef4444,
                    17px 10px 0 #ef4444,
                    0 18px 0 #ef4444,
                    -17px 10px 0 #ef4444,
                    -16px -10px 0 #ef4444;
            }
        }

        @keyframes heartSparkAlt {
            0% { opacity: 0; box-shadow: 0 0 0 #facc15; transform: scale(0.35) rotate(22deg); }
            35% { opacity: 1; }
            100% {
                opacity: 0;
                transform: scale(0.8) rotate(22deg);
                box-shadow:
                    0 -13px 0 #facc15,
                    12px -7px 0 #facc15,
                    12px 7px 0 #facc15,
                    0 13px 0 #facc15,
                    -12px 7px 0 #facc15,
                    -12px -7px 0 #facc15;
            }
        }

        .question-area::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(239, 68, 68, 0.34);
            box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.42);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .question-area.wrong-flash::after {
            animation: wrongFlash 0.52s ease-out;
        }

        @keyframes wrongFlash {
            0%, 100% { opacity: 0; }
            16% { opacity: 0.88; }
            34% { opacity: 0.12; }
            52% { opacity: 0.78; }
            72% { opacity: 0.08; }
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 22px 20px;
            animation: fadeIn 0.22s ease;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        #menu-screen {
            justify-content: flex-start;
            align-items: stretch;
            gap: 12px;
            padding: 0 24px 18px;
            overflow: hidden;
        }

        .menu-hero {
            display: flex;
            justify-content: flex-start;
            align-items: end;
            gap: 14px;
            flex-shrink: 0;
            padding: 2px 4px 0;
        }

        #menu-screen h1 {
            margin: 0;
            font-size: clamp(1.72rem, 3.2vw, 2.36rem);
            line-height: 1.02;
            letter-spacing: -0.06em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
            gap: 16px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .setting-card {
            border-radius: 26px;
            border: 1px solid var(--border-color);
            background: var(--soft-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }

        .card-title h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: -0.03em;
        }

        .setting-group,
        .stepper-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .stepper-stack {
            display: grid;
            gap: 12px;
            min-height: 0;
        }

        label {
            font-weight: 1000;
            color: var(--text-color);
            font-size: 0.88rem;
            letter-spacing: -0.01em;
        }

        .counter-control {
            display: grid;
            grid-template-columns: 62px minmax(0, 1fr) 62px;
            align-items: center;
            overflow: hidden;
            min-height: 56px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--input-bg);
        }

        .step-btn {
            height: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 0;
            background: var(--surface-alt);
            color: var(--text-color);
            font-size: 1.55rem;
            font-weight: 1000;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            touch-action: none;
            user-select: none;
        }

        .counter-control .step-btn:first-child {
            border-right: 1px solid var(--border-color);
        }

        .counter-control .step-btn:last-child {
            border-left: 1px solid var(--border-color);
            background: var(--step-accent-bg);
        }

        .counter-control input[type="number"] {
            width: 100%;
            height: 56px;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text-color);
            text-align: center;
            font-family: inherit;
            font-size: 1.72rem;
            font-weight: 1000;
            letter-spacing: -0.05em;
            padding: 0 8px;
            appearance: textfield;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .operation-slider {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 7px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 21px;
        }

        .operation-slider input {
            display: none;
        }

        .operation-slider label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            min-height: 76px;
            border-radius: 16px;
            cursor: pointer;
            color: var(--muted-color);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .operation-symbol {
            font-size: 2rem;
            line-height: 1;
            font-weight: 1000;
            color: inherit;
        }

        .operation-text {
            font-size: 0.72rem;
            font-weight: 1000;
            letter-spacing: -0.01em;
        }

        .operation-slider input:checked + label {
            background: var(--primary-color);
            color: white;
            box-shadow: var(--button-shadow);
            transform: translateY(-1px);
        }

        .level-wrap {
            position: relative;
        }

        select {
            width: 100%;
            min-height: 58px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 900;
            padding: 0 48px 0 16px;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .level-wrap::after {
            content: "⌄";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-55%);
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 1000;
            pointer-events: none;
        }

        .chance-toggle {
            min-height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 14px 0 16px;
            cursor: pointer;
        }

        .chance-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .chance-box {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            display: grid;
            place-items: center;
            color: white;
            background: var(--input-bg);
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
            flex: 0 0 auto;
        }

        .chance-box svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0;
            transform: scale(0.72);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .chance-toggle input:checked + .chance-box {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.02);
        }

        .chance-toggle input:checked + .chance-box svg {
            opacity: 1;
            transform: scale(1);
        }

        button {
            font-family: inherit;
        }

        .btn-start {
            width: 100%;
            min-height: 58px;
            border: 0;
            border-radius: 22px;
            background: var(--primary-color);
            color: white;
            font-size: 1.05rem;
            font-weight: 1000;
            cursor: pointer;
            margin-top: auto;
            box-shadow: var(--button-shadow);
            letter-spacing: -0.01em;
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 16px;
            min-height: 0;
        }

        .question-area {
            --game-font-size: clamp(3rem, 8vw, 5.8rem);
            --question-row-height: calc(var(--game-font-size) * 1.08);
            --answer-row-height: calc(var(--game-font-size) * 1.22);
            flex: 1;
            display: grid;
            grid-template-rows: minmax(0, 1fr) var(--question-row-height) var(--answer-row-height) minmax(0, 1fr);
            row-gap: 12px;
            justify-items: center;
            align-items: center;
            background: var(--soft-card);
            border-radius: 28px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        #question-text,
        .answer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2em;
            z-index: 1;
        }

        #question-text {
            grid-row: 2;
            width: 100%;
            height: var(--question-row-height);
            font-size: var(--game-font-size);
            font-weight: 1000;
            line-height: 1;
            letter-spacing: -0.04em;
            overflow: hidden;
        }

        .answer-display {
            grid-row: 3;
            width: 170px;
            height: var(--answer-row-height);
            border-bottom: 7px solid var(--secondary-color);
            margin-top: 0;
            color: var(--primary-color);
            font-size: var(--game-font-size);
            font-weight: 1000;
            line-height: 1;
            letter-spacing: -0.04em;
            padding: 0 8px 6px;
            overflow: hidden;
        }

        .digit-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.08em;
        }

        .digit-group.multi-digit {
            gap: 0.05em;
        }

        .math-operator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0.7em;
            margin: 0 0.02em;
        }

        .question-area.vertical-mode {
            --vertical-font-size: clamp(2.5rem, 6vw, 4.35rem);
            --vertical-answer-size: clamp(2.8rem, 6.4vw, 4.7rem);
            grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
            row-gap: 8px;
        }

        .question-area.vertical-mode #question-text {
            width: min(64%, 225px);
            height: auto;
            overflow: visible;
            align-items: stretch;
            font-size: var(--vertical-font-size);
        }

        .vertical-question {
            width: 100%;
            display: grid;
            justify-items: stretch;
            line-height: 0.92;
            font-variant-numeric: tabular-nums;
        }

        .vertical-number {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            gap: 0.08em;
        }

        .vertical-number .digit-group {
            grid-column: 1;
            justify-self: center;
        }

        .vertical-divider {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            align-items: center;
            gap: 0.08em;
            margin-top: 0.12em;
        }

        .vertical-line {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: var(--secondary-color);
        }

        .vertical-operator {
            display: grid;
            place-items: center;
            font-size: 0.72em;
            line-height: 1;
        }

        .question-area.vertical-mode .answer-display {
            width: min(64%, 225px);
            height: auto;
            min-height: calc(var(--vertical-answer-size) * 1.05);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            gap: 0.08em;
            border-bottom: 0;
            padding: 0;
            font-size: var(--vertical-answer-size);
        }

        .question-area.vertical-mode .answer-display .digit-group {
            grid-column: 1;
            justify-self: center;
        }

        .numpad {
            flex: 0 0 38%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .handwriting-panel {
            flex: 0 0 38%;
            height: 100%;
            min-height: 0;
            display: none;
            grid-template-rows: minmax(0, 1fr) 58px;
            gap: 10px;
        }

        .handwriting-canvas-wrap {
            position: relative;
            min-height: 0;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            background: var(--input-bg);
        }

        #handwritingCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        .handwriting-actions {
            display: grid;
            grid-template-columns: 1fr 1.45fr;
            gap: 10px;
            min-height: 0;
        }

        .btn-handwriting-clear,
        .btn-handwriting-ok {
            border: 1px solid var(--border-color);
            border-radius: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 1000;
            transition: transform 0.14s ease;
        }

        .btn-handwriting-clear {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-handwriting-ok {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-handwriting-clear:active,
        .btn-handwriting-ok:active {
            transform: scale(0.97);
        }

        .btn-num {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: clamp(2.8rem, 4.5vw, 3.25rem);
            font-weight: 1000;
            cursor: pointer;

<script>
// ============================================================
    // KODE HYBRID TENSORFLOW.JS (SISTEM OTOMATIS ONLINE/OFFLINE)
    // ============================================================
    let tfModel = null;
    let isUsingTensorFlow = false;

    async function initHandwritingAI() {
        if (!navigator.onLine) {
            console.log("Status: Offline. Menggunakan MLP Bawaan (Pure JS).");
            isUsingTensorFlow = false;
            return;
        }

        try {
            await loadDynamicScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js");
            tfModel = await tf.loadLayersModel('./model/model.json');
            isUsingTensorFlow = true;
            console.log("Status: Online! Berhasil memuat TensorFlow.js CNN Model.");
        } catch (error) {
            console.warn("Gagal memuat TensorFlow.js / Model file. Fallback ke MLP Bawaan.", error);
            isUsingTensorFlow = false;
        }
    }

    function loadDynamicScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    window.addEventListener('DOMContentLoaded', initHandwritingAI);
    // ============================================================
    let currentLevel = 1;
    let currentOperation = 'add';
    let totalQuestionsSetting = 10;

    const levelConfigs = {
        1: { add: [[1, 5], [1, 5]], subtract: [[1, 5], [1, 5]] },
        2: { add: [[1, 5], [5, 10]], subtract: [[5, 10], [1, 5]] },
        3: { add: [[1, 5], [10, 15]], subtract: [[10, 15], [1, 5]] },
        4: { add: [[1, 5], [15, 20]], subtract: [[15, 20], [1, 5]] },
        5: { add: [[5, 10], [5, 10]], subtract: [[5, 10], [5, 10]] },
        6: { add: [[5, 10], [10, 15]], subtract: [[10, 15], [5, 10]] },
        7: { add: [[5, 10], [15, 20]], subtract: [[15, 20], [5, 10]] },

    function updateLevelOptions() {
        const selectedOperation = document.querySelector('input[name="operationMode"]:checked').value;
        const levelSelect = document.getElementById('levelSelect');

        Object.keys(levelConfigs).forEach(level => {
            const option = levelSelect.querySelector(`option[value="${level}"]`);
            const config = levelConfigs[level];
            let ranges;
            let symbol;

            if (level === '9' || level === '10') {
                const layoutName = level === '9' ? 'Bersusun' : 'Mendatar';
                const levelDescription = selectedOperation === 'add'
                    ? `2 Digit ${layoutName} tanpa menyimpan`
                    : selectedOperation === 'subtract'
                        ? `2 Digit ${layoutName} tanpa meminjam`
                        : `2 Digit ${layoutName} campuran`;

                option.textContent = `Level ${level} (${levelDescription})`;
                return;
            }

            if (selectedOperation === 'add') {
                ranges = config.add;
                symbol = '+';
            } else if (selectedOperation === 'subtract') {
                ranges = config.subtract;
                symbol = '-';
            } else {
                ranges = config.subtract;
                symbol = '&';
            }

            option.textContent = `Level ${level} (${formatRange(ranges[0])} ${symbol} ${formatRange(ranges[1])})`;
        });
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');

        } else {

        }
    }

    function updateTimeSummary() {
        const selectedEl = document.getElementById('time-selected-value');
        const usedEl = document.getElementById('time-used-value');
        const remainingEl = document.getElementById('time-remaining-value');

        if (!selectedEl || !usedEl || !remainingEl) return;

        if (selectedTimeSeconds > 0) {
            const safeRemaining = Math.max(Math.min(remainingSeconds, selectedTimeSeconds), 0);
            const usedSeconds = Math.max(selectedTimeSeconds - safeRemaining, 0);

            selectedEl.textContent = formatTime(selectedTimeSeconds);
            usedEl.textContent = formatTime(usedSeconds);
            remainingEl.textContent = formatTime(safeRemaining);
        } else {
            const elapsedSeconds = gameStartTimestamp > 0
                ? Math.max(Math.floor((Date.now() - gameStartTimestamp) / 1000), 0)
                : 0;

            selectedEl.textContent = 'Bebas';
            usedEl.textContent = formatTime(elapsedSeconds);
            remainingEl.textContent = '—';
        }
    }

    function clampNumber(value, min, max, fallback) {
        const parsed = parseInt(value);
        if (isNaN(parsed)) return fallback;
        return Math.min(Math.max(parsed, min), max);
    }

    function normalizeValue(inputId, min, max, fallback) {
        const input = document.getElementById(inputId);
        const normalized = clampNumber(input.value, min, max, fallback);
        input.value = normalized;
        return normalized;
    }

    function stepValue(inputId, delta, min, max) {
        const input = document.getElementById(inputId);
        let current = parseInt(input.value);
        if (isNaN(current)) current = min;

        let nextValue = current + delta;
        if (nextValue > max) nextValue = min;
        if (nextValue < min) nextValue = max;

        input.value = nextValue;
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function initializeHoldStepButtons() {
        document.querySelectorAll('.step-btn[data-step-input]').forEach(button => {
            const performStep = () => {
                stepValue(
                    button.dataset.stepInput,
                    parseInt(button.dataset.stepDelta),
                    parseInt(button.dataset.stepMin),
                    parseInt(button.dataset.stepMax)
                );
            };

            const stopHold = () => {
                clearTimeout(button._holdDelayTimer);
                clearInterval(button._holdRepeatTimer);
                button._holdDelayTimer = null;
                button._holdRepeatTimer = null;
            };

            button.addEventListener('pointerdown', event => {
                if (typeof event.button === 'number' && event.button !== 0) return;
                event.preventDefault();
                stopHold();
                performStep();

                try {
                    button.setPointerCapture(event.pointerId);
                } catch (error) {}

                button._holdDelayTimer = setTimeout(() => {
                    button._holdRepeatTimer = setInterval(performStep, 72);
                }, 360);
            });

            button.addEventListener('pointerup', stopHold);
            button.addEventListener('pointercancel', stopHold);
            button.addEventListener('lostpointercapture', stopHold);
            button.addEventListener('contextmenu', event => event.preventDefault());
            button.addEventListener('click', event => event.preventDefault());

            button.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    performStep();
                }
            });
        });
    }

    function setInputModeToggleVisibility(visible) {
        const toggle = document.getElementById('inputModeToggle');
        if (!toggle) return;
        toggle.style.display = visible ? 'inline-flex' : 'none';
    }

    function updateInputModeToggle() {
        const icon = document.getElementById('inputModeIcon');
        const toggle = document.getElementById('inputModeToggle');
        if (!icon || !toggle) return;

        const handwritingActive = inputMode === 'handwriting';
        icon.innerHTML = handwritingActive ? inputModeIcons.keyboard : inputModeIcons.pencil;
        toggle.setAttribute('aria-label', handwritingActive ? 'Gunakan tombol angka' : 'Tulis dengan tangan');
        toggle.setAttribute('title', handwritingActive ? 'Tombol Angka' : 'Tulis Tangan');
    }

    function toggleInputMode() {
        if (!gameInProgress || inputLocked) return;
        setInputMode(inputMode === 'keypad' ? 'handwriting' : 'keypad');
    }

    function setInputMode(mode) {
        const nextMode = mode === 'handwriting' ? 'handwriting' : 'keypad';
        inputMode = nextMode;

        const numpad = document.querySelector('.numpad');
        const handwritingPanel = document.getElementById('handwritingPanel');

        if (numpad) numpad.style.display = nextMode === 'keypad' ? 'grid' : 'none';
        if (handwritingPanel) handwritingPanel.style.display = nextMode === 'handwriting' ? 'grid' : 'none';

        updateInputModeToggle();

        if (nextMode === 'handwriting') {
            requestAnimationFrame(() => resizeHandwritingCanvas(true));
        }
    }

    function initializeHandwritingCanvas() {
        const canvas = document.getElementById('handwritingCanvas');
        if (!canvas) return;

        handwritingContext = canvas.getContext('2d', { willReadFrequently: true });
        resizeHandwritingCanvas(false);

        const getPoint = event => {
            const rect = canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        };

        const beginStroke = event => {
            if (!gameInProgress || inputLocked || inputMode !== 'handwriting') return;
            event.preventDefault();

            if (!handwritingHasInk && currentAnswer !== '') {
                currentAnswer = '';
                updateInputDisplay();
            }

            clearTimeout(handwritingRecognitionTimer);
            handwritingDrawing = true;
            handwritingHasInk = true;
            handwritingLastPoint = getPoint(event);

            try {
                canvas.setPointerCapture(event.pointerId);
            } catch (error) {}

            configureHandwritingBrush();
            handwritingContext.beginPath();
            handwritingContext.moveTo(handwritingLastPoint.x, handwritingLastPoint.y);
            handwritingContext.lineTo(handwritingLastPoint.x + 0.01, handwritingLastPoint.y + 0.01);
            handwritingContext.stroke();
        };

        const continueStroke = event => {
            if (!handwritingDrawing || !handwritingContext) return;
            event.preventDefault();
            const point = getPoint(event);
            configureHandwritingBrush();
            handwritingContext.beginPath();
            handwritingContext.moveTo(handwritingLastPoint.x, handwritingLastPoint.y);
            handwritingContext.lineTo(point.x, point.y);
            handwritingContext.stroke();
            handwritingLastPoint = point;
        };

        const endStroke = event => {
            if (!handwritingDrawing) return;
            event.preventDefault();
            handwritingDrawing = false;
            handwritingLastPoint = null;
            scheduleHandwritingRecognition();
        };

        canvas.addEventListener('pointerdown', beginStroke);
        canvas.addEventListener('pointermove', continueStroke);
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('contextmenu', event => event.preventDefault());

        if ('ResizeObserver' in window) {
            handwritingResizeObserver = new ResizeObserver(() => {
                if (inputMode === 'handwriting') resizeHandwritingCanvas(true);
            });
            handwritingResizeObserver.observe(canvas.parentElement);
        } else {
            window.addEventListener('resize', () => {
                if (inputMode === 'handwriting') resizeHandwritingCanvas(true);
            });
        }
    }

    function configureHandwritingBrush() {
        if (!handwritingContext) return;
        const canvas = document.getElementById('handwritingCanvas');
        const baseSize = Math.max(12, Math.min(canvas.clientWidth, canvas.clientHeight) * 0.055);
        const inkColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim() || '#0f172a';
        handwritingContext.strokeStyle = inkColor;
        handwritingContext.lineWidth = baseSize;
        handwritingContext.lineCap = 'round';
        handwritingContext.lineJoin = 'round';
    }

    function resizeHandwritingCanvas(preserveInk = true) {
        const canvas = document.getElementById('handwritingCanvas');
        if (!canvas || !handwritingContext) return;

        const rect = canvas.getBoundingClientRect();
        if (rect.width < 2 || rect.height < 2) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const targetWidth = Math.max(1, Math.round(rect.width * dpr));
        const targetHeight = Math.max(1, Math.round(rect.height * dpr));

        if (canvas.width === targetWidth && canvas.height === targetHeight) return;

        let snapshot = null;
        if (preserveInk && handwritingHasInk && canvas.width > 0 && canvas.height > 0) {
            snapshot = document.createElement('canvas');
            snapshot.width = canvas.width;
            snapshot.height = canvas.height;
            snapshot.getContext('2d').drawImage(canvas, 0, 0);
        }

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        handwritingContext = canvas.getContext('2d', { willReadFrequently: true });
        handwritingContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        configureHandwritingBrush();

        if (snapshot) {
            handwritingContext.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, rect.width, rect.height);
        }
    }

    function clearHandwriting(resetAnswer = false) {
        clearTimeout(handwritingRecognitionTimer);
        handwritingDrawing = false;
        handwritingLastPoint = null;
        handwritingHasInk = false;

        const canvas = document.getElementById('handwritingCanvas');
        if (canvas && handwritingContext) {
            handwritingContext.save();
            handwritingContext.setTransform(1, 0, 0, 1, 0, 0);
            handwritingContext.clearRect(0, 0, canvas.width, canvas.height);
            handwritingContext.restore();
        }

        if (resetAnswer) {
            currentAnswer = '';
            updateInputDisplay();
        }
    }

    function scheduleHandwritingRecognition() {
        clearTimeout(handwritingRecognitionTimer);
        handwritingRecognitionTimer = setTimeout(() => {
            if (!handwritingHasInk || inputMode !== 'handwriting' || inputLocked) return;
            const recognized = recognizeHandwrittenAnswer();
            if (recognized !== '') {
                currentAnswer = recognized.slice(0, 2);
                updateInputDisplay();
            }
        }, 260);
    }

    function createAnalysisCanvas() {
        const source = document.getElementById('handwritingCanvas');
        if (!source || !source.width || !source.height) return null;

        const maxSide = 320;
        const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        return canvas;
    }

    function getInkData(canvas) {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const alpha = new Uint8Array(canvas.width * canvas.height);
        let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;

        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
                const a = imageData.data[(y * canvas.width + x) * 4 + 3];
                alpha[y * canvas.width + x] = a;
                if (a > 18) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (maxX < minX || maxY < minY) return null;
        return { alpha, width: canvas.width, height: canvas.height, minX, minY, maxX, maxY };
    }

    function countInkInRegion(ink, x1, x2, y1, y2) {
        let count = 0;
        for (let y = y1; y <= y2; y++) {
            for (let x = x1; x <= x2; x++) {
                if (ink.alpha[y * ink.width + x] > 18) count++;
            }
        }
        return count;
    }

    function splitDigitRegions(ink) {
        const { minX, maxX, minY, maxY } = ink;
        const boxWidth = maxX - minX + 1;
        const boxHeight = maxY - minY + 1;
        const projection = [];

        for (let x = minX; x <= maxX; x++) {
            let sum = 0;
            for (let y = minY; y <= maxY; y++) {
                if (ink.alpha[y * ink.width + x] > 18) sum++;
            }
            projection.push(sum);
        }

        const start = Math.max(1, Math.floor(boxWidth * 0.16));
        const end = Math.min(boxWidth - 2, Math.ceil(boxWidth * 0.84));
        const lowThreshold = Math.max(0, Math.floor(boxHeight * 0.012));
        let bestGap = null;
        let gapStart = -1;

        for (let i = start; i <= end + 1; i++) {
            const isGap = i <= end && projection[i] <= lowThreshold;
            if (isGap && gapStart < 0) gapStart = i;
            if ((!isGap || i === end + 1) && gapStart >= 0) {
                const gapEnd = i - 1;
                const gapLength = gapEnd - gapStart + 1;
                if (!bestGap || gapLength > bestGap.length) {
                    bestGap = { start: gapStart, end: gapEnd, length: gapLength };
                }
                gapStart = -1;
            }
        }

        let splitX = null;
        if (bestGap) {
            const candidate = minX + Math.floor((bestGap.start + bestGap.end) / 2);
            const leftInk = countInkInRegion(ink, minX, candidate - 1, minY, maxY);
            const rightInk = countInkInRegion(ink, candidate + 1, maxX, minY, maxY);
            const minSideInk = Math.max(8, Math.round(boxHeight * 0.12));
            if (leftInk >= minSideInk && rightInk >= minSideInk && bestGap.length >= Math.max(2, Math.round(boxWidth * 0.018))) {
                splitX = candidate;
            }
        }

        // Jika dua angka ditulis sangat dekat tanpa kolom benar-benar kosong,
        // cari lembah proyeksi di area tengah hanya bila bentuk keseluruhan cukup lebar.
        if (splitX === null && boxWidth / Math.max(boxHeight, 1) > 0.92) {
            const valleyStart = Math.floor(boxWidth * 0.30);
            const valleyEnd = Math.ceil(boxWidth * 0.70);
            let bestIndex = valleyStart;
            let bestValue = Infinity;
            let average = 0;
            for (let i = valleyStart; i <= valleyEnd; i++) {
                average += projection[i] || 0;
                if ((projection[i] || 0) < bestValue) {
                    bestValue = projection[i] || 0;
                    bestIndex = i;
                }
            }
            average /= Math.max(1, valleyEnd - valleyStart + 1);
            const candidate = minX + bestIndex;
            const leftInk = countInkInRegion(ink, minX, candidate, minY, maxY);
            const rightInk = countInkInRegion(ink, candidate + 1, maxX, minY, maxY);
            if (bestValue <= average * 0.36 && leftInk > boxHeight * 0.12 && rightInk > boxHeight * 0.12) {
                splitX = candidate;
            }
        }

        if (splitX === null) {
            return [{ x1: minX, x2: maxX, y1: minY, y2: maxY }];
        }

        return [
            { x1: minX, x2: splitX - 1, y1: minY, y2: maxY },
            { x1: splitX + 1, x2: maxX, y1: minY, y2: maxY }
        ];
    }

    function tightenDigitRegion(ink, region) {
        let minX = region.x2, minY = region.y2, maxX = region.x1, maxY = region.y1;
        for (let y = region.y1; y <= region.y2; y++) {
            for (let x = region.x1; x <= region.x2; x++) {
                if (ink.alpha[y * ink.width + x] > 18) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }
        if (maxX < minX || maxY < minY) return region;
        return { x1: minX, x2: maxX, y1: minY, y2: maxY };
    }

    function normalizeDigit(canvas, ink, rawRegion) {
        const region = tightenDigitRegion(ink, rawRegion);
        const sourceWidth = Math.max(1, region.x2 - region.x1 + 1);
        const sourceHeight = Math.max(1, region.y2 - region.y1 + 1);
        const target = document.createElement('canvas');
        target.width = 16;
        target.height = 16;
        const ctx = target.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, 16, 16);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Normalisasi bentuk digit ke 16x16. Rasio asli dipertahankan agar
        // angka seperti 1 tidak melebar dan angka bulat seperti 0/8 tetap proporsional.
        const maxHeight = 15.2;
        const maxWidth = 13.2;
        const scale = Math.min(maxWidth / sourceWidth, maxHeight / sourceHeight);
        const drawWidth = Math.max(1, sourceWidth * scale);
        const drawHeight = Math.max(1, sourceHeight * scale);
        const dx = (16 - drawWidth) / 2;
        const dy = (16 - drawHeight) / 2;

        ctx.drawImage(
            canvas,
            region.x1, region.y1, sourceWidth, sourceHeight,
            dx, dy, drawWidth, drawHeight
        );

        const data = ctx.getImageData(0, 0, 16, 16).data;
        const vector = new Array(256);
        for (let i = 0; i < 256; i++) {
            vector[i] = data[i * 4 + 3] / 255;
        }
        return vector;
    }

    function classifyDigitMLP(vector) {
        const weights = digitRecognitionModel.w;
        const biases = digitRecognitionModel.b;
        const logits = biases.slice();
        const inputLength = Math.min(vector.length, weights.length);

        for (let i = 0; i < inputLength; i++) {
            const value = vector[i];
            if (!value) continue;
            const row = weights[i];
            for (let digit = 0; digit < 10; digit++) {
                logits[digit] += value * row[digit];
            }
        }

        let bestDigit = 0;
        for (let digit = 1; digit < 10; digit++) {
            if (logits[digit] > logits[bestDigit]) bestDigit = digit;
        }

        const maxLogit = Math.max(...logits);
        let expSum = 0;
        const expValues = logits.map(logit => {
            const value = Math.exp(logit - maxLogit);
            expSum += value;
            return value;
        });
        const confidence = expSum > 0 ? expValues[bestDigit] / expSum : 0;

        return { digit: bestDigit, confidence: confidence };
    }

    function classifyDigit(vector) {
        // JALUR 1: Menggunakan TensorFlow.js jika sedang online & model terunduh
        if (isUsingTensorFlow && tfModel && typeof tf !== 'undefined') {
            try {
                return predictWithTensorFlow(vector);
            } catch (err) {
                console.error("TensorFlow Error, beralih ke MLP Bawaan:", err);
            }
        }
        // JALUR 2: Menggunakan MLP Bawaan (Offline / Fallback)
        return classifyDigitMLP(vector);
    }

    function normalizeDigit28(canvas, ink, rawRegion) {
        const region = tightenDigitRegion(ink, rawRegion);
        const sourceWidth = Math.max(1, region.x2 - region.x1 + 1);
        const sourceHeight = Math.max(1, region.y2 - region.y1 + 1);
        const target = document.createElement('canvas');
        target.width = 28;
        target.height = 28;
        const ctx = target.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, 28, 28);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Masukkan gambar tajam langsung ke bingkai 28x28 (margin 4px)
        const scale = Math.min(20 / sourceWidth, 20 / sourceHeight);
        const drawWidth = Math.max(1, sourceWidth * scale);
        const drawHeight = Math.max(1, sourceHeight * scale);
        const dx = (28 - drawWidth) / 2;
        const dy = (28 - drawHeight) / 2;

        ctx.drawImage(
            canvas,
            region.x1, region.y1, sourceWidth, sourceHeight,
            dx, dy, drawWidth, drawHeight
        );

        const data = ctx.getImageData(0, 0, 28, 28).data;
        const vector = new Float32Array(784);
        for (let i = 0; i < 784; i++) {
            vector[i] = data[i * 4 + 3] / 255.0;
        }
        return vector;
    }

    function predictWithTensorFlow(vector) {
        return tf.tidy(() => {
            const inputTensor = tf.tensor2d(vector, [1, 784], 'float32');
            const prediction = tfModel.predict(inputTensor);
            const probabilities = prediction.dataSync();
            const bestDigit = prediction.argMax(-1).dataSync()[0];
            const confidence = probabilities[bestDigit];

            return { digit: bestDigit, confidence: confidence };
        });
    }

    function recognizeHandwrittenAnswer() {
        const analysisCanvas = createAnalysisCanvas();
        if (!analysisCanvas) return '';
        const ink = getInkData(analysisCanvas);
        if (!ink) return '';

        const regions = splitDigitRegions(ink).slice(0, 2);
        return regions.map(region => {
            // Jika TensorFlow aktif, gunakan resolusi tajam 28x28 langsung tanpa blur!
            const vector = (isUsingTensorFlow && tfModel) 
                ? normalizeDigit28(analysisCanvas, ink, region)
                : normalizeDigit(analysisCanvas, ink, region);
            return String(classifyDigit(vector).digit);
        }).join('');
    }

    function startGame() {
        clearConfetti();
        currentLevel = parseInt(document.getElementById('levelSelect').value);
        currentOperation = document.querySelector('input[name="operationMode"]:checked').value;
        
        const qVal = normalizeValue('questionCount', 1, 100, 20);
        totalQuestionsSetting = (qVal === 0 || isNaN(qVal)) ? Infinity : qVal;

        const minutes = normalizeValue('timeMin', 0, 60, 1);
        const seconds = normalizeValue('timeSec', 0, 59, 0);
        
        currentQuestionIndex = 0;
        correctAnswers = 0;
        wrongAnswers = 0;
        currentAnswer = "";
        lastQuestionStr = "";
        chanceModeEnabled = document.getElementById('chanceMode').checked;
        globalLivesRemaining = 3;
        retryQuestions = [];
        generatedQuestionCount = 0;
        currentQuestionData = null;
        inputLocked = false;
        gameInProgress = true;
        inputMode = 'keypad';
        clearTimeout(feedbackTimeout);
        clearHandwriting(false);
        setInputMode('keypad');
        setInputModeToggleVisibility(true);
        setLivesVisibility(chanceModeEnabled && totalQuestionsSetting !== Infinity);
        renderLives(3);

        selectedTimeSeconds = (minutes * 60) + seconds;
        remainingSeconds = selectedTimeSeconds;
        gameStartTimestamp = Date.now();
        timerLimitActive = remainingSeconds > 0;
        document.getElementById('timerDisplay').textContent = formatTime(remainingSeconds);
        updateTimerColor();
        document.getElementById('questionCounter').style.display = 'grid'; 
        
        clearInterval(timerInterval);
        if(remainingSeconds > 0) {
            timerInterval = setInterval(updateTimer, 1000);
        }

        updateInputDisplay();
        generateQuestion();

    function updateTimer() {
        remainingSeconds = Math.max(remainingSeconds - 1, 0);
        document.getElementById('timerDisplay').textContent = formatTime(remainingSeconds);
        updateTimerColor();

        if (remainingSeconds === 0) {
            finishGame();
        }
    }

    function updateQuestionCounter() {
        const counterEl = document.getElementById('questionCounter');

        if (chanceModeEnabled && totalQuestionsSetting !== Infinity) {
            const finalizedQuestions = correctAnswers + wrongAnswers;
            const displayNumber = Math.min(finalizedQuestions + 1, totalQuestionsSetting);
            counterEl.textContent = `${displayNumber}/${totalQuestionsSetting}`;
            return;
        }

        if (totalQuestionsSetting === Infinity) {
            counterEl.textContent = `Soal: ${currentQuestionIndex + 1}`;
        } else {
            counterEl.textContent = `${currentQuestionIndex + 1}/${totalQuestionsSetting}`;
        }
    }

    function setLivesVisibility(visible) {
        const livesDisplay = document.getElementById('livesDisplay');
        if (!livesDisplay) return;
        livesDisplay.style.display = visible ? 'flex' : 'none';
    }

    function renderLives(remainingLives = 3) {
        const safeLives = Math.max(0, Math.min(remainingLives, 3));
        document.querySelectorAll('#livesDisplay .heart-slot').forEach((slot, index) => {
            slot.classList.remove('exploding');
            slot.classList.toggle('lost', index < (3 - safeLives));
        });

        const livesDisplay = document.getElementById('livesDisplay');
        if (livesDisplay) {
            livesDisplay.setAttribute('aria-label', `${safeLives} dari 3 kesempatan tersisa`);
        }
    }

    function playWrongFeedback(lostHeartIndex, remainingLives, onComplete) {
        const questionArea = document.querySelector('.question-area');
        const heartSlot = Number.isInteger(lostHeartIndex)
            ? document.querySelector(`#livesDisplay .heart-slot[data-heart-index="${lostHeartIndex}"]`)
            : null;

        if (questionArea) {
            questionArea.classList.remove('wrong-flash');
            void questionArea.offsetWidth;
            questionArea.classList.add('wrong-flash');
        }

        if (heartSlot) {
            heartSlot.classList.remove('lost', 'exploding');
            void heartSlot.offsetWidth;
            heartSlot.classList.add('exploding');
        }

        clearTimeout(feedbackTimeout);
        feedbackTimeout = setTimeout(() => {
            if (questionArea) questionArea.classList.remove('wrong-flash');
            if (heartSlot) {
                heartSlot.classList.remove('exploding');
                heartSlot.classList.add('lost');
            }
            renderLives(remainingLives);
            if (typeof onComplete === 'function') onComplete();
        }, 540);
    }

    function createTwoDigitNumbers(operationForQuestion) {
        if (operationForQuestion === 'add') {
            const tens1 = getRandomInt(1, 8);
            const tens2 = getRandomInt(1, 9 - tens1);
            const units1 = getRandomInt(0, 9);
            const units2 = getRandomInt(0, 9 - units1);

            return {
                n1: (tens1 * 10) + units1,
                n2: (tens2 * 10) + units2
            };
        }

        const tens1 = getRandomInt(1, 9);
        const units1 = getRandomInt(0, 9);
        const tens2 = getRandomInt(1, tens1);
        const units2 = getRandomInt(0, units1);

        return {
            n1: (tens1 * 10) + units1,
            n2: (tens2 * 10) + units2
        };
    }

    function createRandomQuestionData() {
        let n1, n2, operator, answer;
        let newQuestionStr = "";
        let valid = false;
        let attempts = 0;

        while (!valid && attempts < 1000) {
            attempts++;

            const config = levelConfigs[currentLevel];
            const operationForQuestion = currentOperation === 'mixed'
                ? (Math.random() > 0.5 ? 'add' : 'subtract')
                : currentOperation;
            const ranges = currentOperation === 'mixed'
                ? config.subtract
                : (operationForQuestion === 'add' ? config.add : config.subtract);

            if (currentLevel === 9 || currentLevel === 10) {
                const twoDigitNumbers = createTwoDigitNumbers(operationForQuestion);
                n1 = twoDigitNumbers.n1;
                n2 = twoDigitNumbers.n2;
            } else {
                n1 = getRandomInt(ranges[0][0], ranges[0][1]);
                n2 = getRandomInt(ranges[1][0], ranges[1][1]);
            }

            operator = operationForQuestion === 'add' ? '+' : '-';

            if (currentLevel !== 9 && currentLevel !== 10 && operationForQuestion === 'add' && currentOperation === 'add') {
                if (Math.random() > 0.5) {
                    let temp = n1;
                    n1 = n2;
                    n2 = temp;
                }
            }

            if (currentLevel !== 9 && currentLevel !== 10 && operationForQuestion === 'subtract' && n2 > n1) {
                let temp = n1;
                n1 = n2;
                n2 = temp;
            }

            answer = operator === '+' ? n1 + n2 : n1 - n2;
            newQuestionStr = `${n1} ${operator} ${n2}`;

            if (newQuestionStr !== lastQuestionStr && answer <= 99) {
                valid = true;
            }
        }

        return {
            n1,
            n2,
            operator,
            answer,
            questionStr: newQuestionStr,
            displayNumber: 1
        };
    }

    function showQuestion(questionData) {
        currentQuestionData = questionData;
        lastQuestionStr = questionData.questionStr;
        correctAnswerValue = questionData.answer;

        updateQuestionCounter();

        const questionArea = document.querySelector('.question-area');
        const isVerticalLevel = currentLevel === 9;
        questionArea.classList.toggle('vertical-mode', isVerticalLevel);
        document.getElementById('question-text').innerHTML = renderQuestionDisplay(
            questionData.n1,
            questionData.operator,
            questionData.n2,
            isVerticalLevel
        );

        if (chanceModeEnabled && totalQuestionsSetting !== Infinity) {
            renderLives(globalLivesRemaining);
        }

        currentAnswer = "";
        inputLocked = false;
        clearHandwriting(false);
        updateInputDisplay();
    }

    function generateQuestion() {
        let nextQuestion;

        if (chanceModeEnabled && totalQuestionsSetting !== Infinity) {
            if (generatedQuestionCount < totalQuestionsSetting) {
                nextQuestion = createRandomQuestionData();
                generatedQuestionCount++;
                nextQuestion.displayNumber = generatedQuestionCount;
            } else if (retryQuestions.length > 0) {
                nextQuestion = retryQuestions.shift();
            } else {
                finishGame();
                return;
            }
        } else {
            nextQuestion = createRandomQuestionData();
        }

        showQuestion(nextQuestion);
    }

    function inputNum(num) {
        if (!gameInProgress || inputLocked) return;
        if (currentAnswer.length < 2) {
            currentAnswer += num;
            updateInputDisplay();
        }
    }

    function deleteInput() {
        if (!gameInProgress || inputLocked) return;
        currentAnswer = currentAnswer.slice(0, -1);
        if (inputMode === 'handwriting') clearHandwriting(false);
        updateInputDisplay();
    }

    function updateInputDisplay() {
        const target = document.getElementById('user-input');
        target.innerHTML = currentAnswer ? renderDigitGroup(currentAnswer) : '';
    }

    function submitAnswer() {
        if (!gameInProgress || inputLocked) return;

        // Jika anak langsung menekan OK sesaat setelah menulis, kenali dulu
        // tulisan terbaru tanpa harus menunggu jeda pengenalan otomatis.
        if (inputMode === 'handwriting' && handwritingHasInk) {
            clearTimeout(handwritingRecognitionTimer);
            const recognized = recognizeHandwrittenAnswer();
            if (recognized !== '') {
                currentAnswer = recognized.slice(0, 2);
                updateInputDisplay();
            }
        }

        if (currentAnswer === "") return;
        const userVal = parseInt(currentAnswer);

        if (chanceModeEnabled && totalQuestionsSetting !== Infinity) {
            inputLocked = true;

            if (userVal === correctAnswerValue) {
                correctAnswers++;

                if (correctAnswers + wrongAnswers >= totalQuestionsSetting) {
                    finishGame();
                } else {
                    generateQuestion();
                }
                return;
            }

            if (!currentQuestionData) {
                inputLocked = false;
                return;
            }

            if (globalLivesRemaining > 0) {
                const livesBefore = globalLivesRemaining;
                const lostHeartIndex = 3 - livesBefore;
                globalLivesRemaining = Math.max(globalLivesRemaining - 1, 0);

                // Selama masih memiliki kesempatan saat jawaban diberikan,
                // soal yang salah dipindahkan ke akhir antrean, termasuk
                // jawaban salah yang menghabiskan hati terakhir.
                retryQuestions.push(currentQuestionData);

                playWrongFeedback(lostHeartIndex, globalLivesRemaining, () => {
                    if (!gameInProgress) return;
                    generateQuestion();
                });

                return;
            }

            // Ketika tiga kesempatan global sudah habis, jawaban salah
            // langsung dianggap salah permanen dan soal tidak diulang lagi.
            wrongAnswers++;

            playWrongFeedback(null, globalLivesRemaining, () => {
                if (!gameInProgress) return;

                if (correctAnswers + wrongAnswers >= totalQuestionsSetting) {
                    finishGame();
                } else {
                    generateQuestion();
                }
            });

            return;
        }

        inputLocked = true;

        if (userVal === correctAnswerValue) {
            correctAnswers++;
        } else {
            wrongAnswers++;
        }

        currentQuestionIndex++;

        if (totalQuestionsSetting !== Infinity && currentQuestionIndex >= totalQuestionsSetting) {
            finishGame();
        } else {
            generateQuestion();
        }
    }

    function finishGame() {
        if (!gameInProgress && document.getElementById('result-screen').classList.contains('active')) return;
        gameInProgress = false;
        inputLocked = true;
        clearInterval(timerInterval);
        clearTimeout(feedbackTimeout);
        document.querySelector('.question-area')?.classList.remove('wrong-flash');
        document.querySelectorAll('#livesDisplay .heart-slot').forEach(slot => slot.classList.remove('exploding'));
        document.getElementById('questionCounter').style.display = 'none';
        setLivesVisibility(false);
        setInputModeToggleVisibility(false);
        clearHandwriting(false);

        const isFixedQuestionMode = totalQuestionsSetting !== Infinity;
        let totalDone = correctAnswers + wrongAnswers;
        let totalForScore = isFixedQuestionMode ? totalQuestionsSetting : totalDone;
        let unansweredQuestions = isFixedQuestionMode ? Math.max(totalQuestionsSetting - totalDone, 0) : 0;

        if (chanceModeEnabled && isFixedQuestionMode) {
            totalForScore = totalQuestionsSetting;
            totalDone = correctAnswers + wrongAnswers;
            unansweredQuestions = Math.max(totalQuestionsSetting - totalDone, 0);
        }

        let score = 0;

        if (totalForScore > 0) {
            score = Math.round((correctAnswers / totalForScore) * 100);
        }

        document.getElementById('final-score').innerHTML = renderDigitGroup(score);
        document.getElementById('stat-correct').textContent = correctAnswers;
        document.getElementById('stat-wrong').textContent = wrongAnswers;
        document.getElementById('stat-unanswered').textContent = unansweredQuestions;
        document.getElementById('stat-total').textContent = totalForScore;

        updateTimeSummary();
        resetHeaderTimer();
        showScreen('result-screen');

        if (score === 100) {
            startConfetti();
        } else {
            clearConfetti();
        }
    }

    function startConfetti() {
        clearConfetti();
        launchConfettiBurst();
    }

    function launchConfettiBurst() {
        const confettiLayer = document.getElementById('confettiLayer');
        const colors = ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0', '#ff9800'];

        confettiLayer.innerHTML = '';

        for (let i = 0; i < 120; i++) {
            const confetti = document.createElement('span');
            confetti.className = 'confetti-piece';
            confetti.style.left = `${Math.random() * 100}%`;
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = `${2.5 + Math.random() * 2}s`;
            confetti.style.animationDelay = `${Math.random() * 0.8}s`;
            confetti.style.setProperty('--drift', `${(Math.random() - 0.5) * 220}px`);
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            confettiLayer.appendChild(confetti);
        }

        confettiTimeout = setTimeout(() => {
            confettiLayer.innerHTML = '';
            confettiLoopTimeout = setTimeout(launchConfettiBurst, 5000);
        }, 5000);
    }

    function clearConfetti() {
        clearTimeout(confettiTimeout);
        clearTimeout(confettiLoopTimeout);
        const confettiLayer = document.getElementById('confettiLayer');
        if (confettiLayer) {
            confettiLayer.innerHTML = '';
        }
    }

    function goHome() {
        clearInterval(timerInterval);
        clearTimeout(feedbackTimeout);
        clearConfetti();
        gameInProgress = false;
        inputLocked = false;
        document.getElementById('questionCounter').style.display = 'none';
        setLivesVisibility(false);
        setInputModeToggleVisibility(false);
        setInputMode('keypad');
        clearHandwriting(true);
        renderLives(3);
        resetHeaderTimer();
        selectedTimeSeconds = 0;
        gameStartTimestamp = 0;
        chanceModeEnabled = false;
        globalLivesRemaining = 3;
        retryQuestions = [];
        generatedQuestionCount = 0;
        currentQuestionData = null;
        const questionArea = document.querySelector('.question-area');
        questionArea.classList.remove('vertical-mode', 'wrong-flash');
        showScreen('menu-screen');
    }

    document.querySelectorAll('.num-key').forEach(button => {
        const showPressColor = () => {
            button.classList.add('key-pressed');

            // Fallback inline agar warna kuning tetap muncul di perangkat/browser
            // yang kadang melewatkan efek :active pada tombol besar touch/click.
            button.style.backgroundColor = 'var(--secondary-color)';
            button.style.color = '#071225';
            button.style.borderColor = 'var(--secondary-color)';
            button.style.boxShadow = '0 0 0 5px rgba(250, 204, 21, 0.28)';

            clearTimeout(button._pressTimer);
            button._pressTimer = setTimeout(() => {
                button.classList.remove('key-pressed');
                button.style.removeProperty('background-color');
                button.style.removeProperty('color');
                button.style.removeProperty('border-color');
                button.style.removeProperty('box-shadow');
            }, 240);
        };

        button.addEventListener('pointerdown', showPressColor);
        button.addEventListener('mousedown', showPressColor);
        button.addEventListener('touchstart', showPressColor, { passive: true });
        button.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                showPressColor();
            }
        });
    });

    document.querySelectorAll('input[name="operationMode"]').forEach(input => {
        input.addEventListener('change', updateLevelOptions);
    });

    document.getElementById('questionCount').addEventListener('change', () => normalizeValue('questionCount', 1, 100, 20));
    document.getElementById('timeMin').addEventListener('change', () => normalizeValue('timeMin', 0, 60, 1));
    document.getElementById('timeSec').addEventListener('change', () => normalizeValue('timeSec', 0, 59, 0));

    try {
        setTheme(localStorage.getItem('rafaHitungTheme') || 'light');
    } catch (error) {
        setTheme('light');
    }

    initializeHoldStepButtons();
    initializeHandwritingCanvas();
    setInputMode('keypad');
    setInputModeToggleVisibility(false);
    setLivesVisibility(false);
    renderLives(3);
    updateLevelOptions();
</script>

</body>
</html>
