<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Berhitung Rafa &amp; Hanan v30</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/Yxl2fhm.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900;1000&display=swap');

        :root {
            --primary-color: #2563eb;
            --secondary-color: #facc15;
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --muted-color: #64748b;
            --card-bg: #ffffff;
            --soft-card: #ffffff;
            --border-color: #dbe4f0;
            --panel-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            --button-shadow: 0 10px 22px rgba(37, 99, 235, 0.16);
            --danger-bg: #fee2e2;
            --danger-text: #dc2626;
            --success-color: #16a34a;
            --input-bg: #ffffff;
            --surface-alt: #f8fafc;
            --brand-text: #ffffff;
            --step-accent-bg: #fef3c7;
        }

        body[data-theme="dark"] {
            --primary-color: #60a5fa;
            --secondary-color: #fde047;
            --bg-color: #090f1a;
            --text-color: #e5eefc;
            --muted-color: #9fb0c8;
            --card-bg: #0f172a;
            --soft-card: #0f172a;
            --border-color: #22304a;
            --panel-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
            --button-shadow: 0 10px 24px rgba(96, 165, 250, 0.18);
            --danger-bg: rgba(239, 68, 68, 0.18);
            --danger-text: #fca5a5;
            --success-color: #86efac;
            --input-bg: #111c31;
            --surface-alt: #111c31;
            --brand-text: #08111f;
            --step-accent-bg: #2a2410;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Nunito", "Comic Sans MS", system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            transition: background 0.25s ease, color 0.25s ease;
        }

        #app-container {
            width: min(96vw, 980px);
            height: min(94dvh, 540px);
            min-height: 470px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            box-shadow: var(--panel-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header,
        .screen,
        .confetti-layer {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px 10px;
            align-items: center;
            height: 64px;
            flex-shrink: 0;
        }

        .header-left,
        .header-right {
            display: flex;
            gap: 9px;
            align-items: center;
        }

        .brand-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            color: var(--text-color);
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .brand-text {
            font-size: 0.98rem;
            white-space: nowrap;
        }

        .btn-home,
        .btn-fullscreen,
        .theme-toggle {
            width: 38px;
            min-width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .btn-home {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: var(--button-shadow);
        }

        .btn-fullscreen,
        .theme-toggle {
            background: var(--soft-card);
            color: var(--text-color);
        }

        .input-mode-toggle,
        .voice-mode-toggle {
            width: 38px;
            min-width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--soft-card);
            color: var(--primary-color);
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
        }

        .input-mode-toggle:hover,
        .voice-mode-toggle:not(:disabled):hover {
            transform: translateY(-1px);
        }

        .input-mode-toggle:active,
        .voice-mode-toggle:not(:disabled):active {
            transform: scale(0.96);
        }

        .voice-mode-toggle.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: var(--button-shadow);
        }

        .voice-mode-toggle:disabled,
        .voice-mode-toggle.unavailable {
            cursor: not-allowed;
            color: var(--muted-color);
            background: var(--surface-alt);
            opacity: 0.46;
            box-shadow: none;
            transform: none;
        }

        .btn-home:hover,
        .btn-fullscreen:hover,
        .theme-toggle:hover,
        .step-btn:hover,
        .btn-start:hover,
        .btn-restart:hover {
            transform: translateY(-1px);
        }

        .btn-home:active,
        .btn-fullscreen:active,
        .theme-toggle:active,
        .step-btn:active,
        .btn-start:active,
        .btn-restart:active,
        .btn-num:active {
            transform: scale(0.96);
        }

        .icon-line {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex: 0 0 auto;
        }

        .theme-toggle > span {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            line-height: 0;
        }

        .question-counter,
        .timer {
            width: 104px;
            min-width: 104px;
            height: 38px;
            place-items: center;
            background: var(--soft-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.12rem;
            font-weight: 1000;
            padding: 0 12px;
        }

        .question-counter {
            display: none;
            color: var(--text-color);
        }

        .timer {
            display: grid;
            font-family: inherit;
            color: var(--primary-color);
        }

        .timer.critical {
            color: var(--danger-text);
        }

        .lives-display {
            height: 38px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 7px;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            background: var(--soft-card);
        }

        .heart-slot {
            width: 22px;
            height: 22px;
            position: relative;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .life-heart {
            width: 21px;
            height: 21px;
            display: block;
            fill: #ef4444;
            stroke: #dc2626;
            stroke-width: 1.35;
            transform-origin: center;
            filter: drop-shadow(0 2px 3px rgba(239, 68, 68, 0.18));
        }

        .heart-slot.lost .life-heart {
            opacity: 1;
            transform: scale(1);
            fill: #ffffff;
            stroke: #94a3b8;
            stroke-width: 1.35;
            filter: none;
        }

        .heart-slot.exploding .life-heart {
            animation: heartBurst 0.52s ease-out forwards;
        }

        .heart-slot.exploding::before,
        .heart-slot.exploding::after {
            content: "";
            position: absolute;
            inset: 50%;
            width: 6px;
            height: 6px;
            margin: -3px;
            border-radius: 999px;
            background: #ef4444;
            pointer-events: none;
            animation: heartSpark 0.52s ease-out forwards;
        }

        .heart-slot.exploding::after {
            background: #facc15;
            animation-name: heartSparkAlt;
        }

        @keyframes heartBurst {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            35% { opacity: 1; transform: scale(1.38) rotate(-8deg); }
            100% { opacity: 0; transform: scale(0.08) rotate(20deg); }
        }

        @keyframes heartSpark {
            0% { opacity: 0; box-shadow: 0 0 0 #ef4444; transform: scale(0.4); }
            35% { opacity: 1; }
            100% {
                opacity: 0;
                transform: scale(0.9);
                box-shadow:
                    0 -18px 0 #ef4444,
                    16px -10px 0 #ef4444,
                    17px 10px 0 #ef4444,
                    0 18px 0 #ef4444,
                    -17px 10px 0 #ef4444,
                    -16px -10px 0 #ef4444;
            }
        }

        @keyframes heartSparkAlt {
            0% { opacity: 0; box-shadow: 0 0 0 #facc15; transform: scale(0.35) rotate(22deg); }
            35% { opacity: 1; }
            100% {
                opacity: 0;
                transform: scale(0.8) rotate(22deg);
                box-shadow:
                    0 -13px 0 #facc15,
                    12px -7px 0 #facc15,
                    12px 7px 0 #facc15,
                    0 13px 0 #facc15,
                    -12px 7px 0 #facc15,
                    -12px -7px 0 #facc15;
            }
        }

        .question-area::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(239, 68, 68, 0.34);
            box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.42);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .question-area.wrong-flash::after {
            animation: wrongFlash 0.52s ease-out;
        }

        @keyframes wrongFlash {
            0%, 100% { opacity: 0; }
            16% { opacity: 0.88; }
            34% { opacity: 0.12; }
            52% { opacity: 0.78; }
            72% { opacity: 0.08; }
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 22px 20px;
            animation: fadeIn 0.22s ease;
            min-height: 0;
        }

        .screen.active {
            display: flex;
        }

        #menu-screen {
            justify-content: flex-start;
            align-items: stretch;
            gap: 12px;
            padding: 0 24px 18px;
            overflow: hidden;
        }

        .menu-hero {
            display: flex;
            justify-content: flex-start;
            align-items: end;
            gap: 14px;
            flex-shrink: 0;
            padding: 2px 4px 0;
        }

        #menu-screen h1 {
            margin: 0;
            font-size: clamp(1.72rem, 3.2vw, 2.36rem);
            line-height: 1.02;
            letter-spacing: -0.06em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
            gap: 16px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .setting-card {
            border-radius: 26px;
            border: 1px solid var(--border-color);
            background: var(--soft-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }

        .card-title h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: -0.03em;
        }

        .setting-group,
        .stepper-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .stepper-stack {
            display: grid;
            gap: 12px;
            min-height: 0;
        }

        label {
            font-weight: 1000;
            color: var(--text-color);
            font-size: 0.88rem;
            letter-spacing: -0.01em;
        }

        .counter-control {
            display: grid;
            grid-template-columns: 62px minmax(0, 1fr) 62px;
            align-items: center;
            overflow: hidden;
            min-height: 56px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--input-bg);
        }

        .step-btn {
            height: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 0;
            background: var(--surface-alt);
            color: var(--text-color);
            font-size: 1.55rem;
            font-weight: 1000;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            touch-action: none;
            user-select: none;
        }

        .counter-control .step-btn:first-child {
            border-right: 1px solid var(--border-color);
        }

        .counter-control .step-btn:last-child {
            border-left: 1px solid var(--border-color);
            background: var(--step-accent-bg);
        }

        .counter-control input[type="number"] {
            width: 100%;
            height: 56px;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text-color);
            text-align: center;
            font-family: inherit;
            font-size: 1.72rem;
            font-weight: 1000;
            letter-spacing: -0.05em;
            padding: 0 8px;
            appearance: textfield;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .operation-slider {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 7px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 21px;
        }

        .operation-slider input {
            display: none;
        }

        .operation-slider label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            min-height: 76px;
            border-radius: 16px;
            cursor: pointer;
            color: var(--muted-color);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .operation-symbol {
            font-size: 2rem;
            line-height: 1;
            font-weight: 1000;
            color: inherit;
        }

        .operation-text {
            font-size: 0.72rem;
            font-weight: 1000;
            letter-spacing: -0.01em;
        }

        .operation-slider input:checked + label {
            background: var(--primary-color);
            color: white;
            box-shadow: var(--button-shadow);
            transform: translateY(-1px);
        }

        .level-wrap {
            position: relative;
        }

        select {
            width: 100%;
            min-height: 58px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 900;
            padding: 0 48px 0 16px;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .level-wrap::after {
            content: "⌄";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-55%);
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 1000;
            pointer-events: none;
        }

        .chance-toggle {
            min-height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 14px 0 16px;
            cursor: pointer;
        }

        .chance-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .chance-box {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            display: grid;
            place-items: center;
            color: white;
            background: var(--input-bg);
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
            flex: 0 0 auto;
        }

        .chance-box svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0;
            transform: scale(0.72);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .chance-toggle input:checked + .chance-box {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.02);
        }

        .chance-toggle input:checked + .chance-box svg {
            opacity: 1;
            transform: scale(1);
        }

        button {
            font-family: inherit;
        }

        .btn-start {
            width: 100%;
            min-height: 58px;
            border: 0;
            border-radius: 22px;
            background: var(--primary-color);
            color: white;
            font-size: 1.05rem;
            font-weight: 1000;
            cursor: pointer;
            margin-top: auto;
            box-shadow: var(--button-shadow);
            letter-spacing: -0.01em;
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 16px;
            min-height: 0;
        }

        .question-area {
            --game-font-size: clamp(3rem, 8vw, 5.8rem);
            --question-row-height: calc(var(--game-font-size) * 1.08);
            --answer-row-height: calc(var(--game-font-size) * 1.22);
            flex: 1;
            display: grid;
            grid-template-rows: minmax(0, 1fr) var(--question-row-height) var(--answer-row-height) minmax(0, 1fr);
            row-gap: 12px;
            justify-items: center;
            align-items: center;
            background: var(--soft-card);
            border-radius: 28px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        #question-text,
        .answer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2em;
            z-index: 1;
        }

        #question-text {
            grid-row: 2;
            width: 100%;
            height: var(--question-row-height);
            font-size: var(--game-font-size);
            font-weight: 1000;
            line-height: 1;
            letter-spacing: -0.04em;
            overflow: hidden;
        }

        .answer-display {
            grid-row: 3;
            width: 170px;
            height: var(--answer-row-height);
            border-bottom: 7px solid var(--secondary-color);
            margin-top: 0;
            color: var(--primary-color);
            font-size: var(--game-font-size);
            font-weight: 1000;
            line-height: 1;
            letter-spacing: -0.04em;
            padding: 0 8px 6px;
            overflow: hidden;
        }

        .digit-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.08em;
        }

        .digit-group.multi-digit {
            gap: 0.05em;
        }

        .math-operator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0.7em;
            margin: 0 0.02em;
        }

        .question-area.vertical-mode {
            --vertical-font-size: clamp(2.5rem, 6vw, 4.35rem);
            --vertical-answer-size: clamp(2.8rem, 6.4vw, 4.7rem);
            grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
            row-gap: 8px;
        }

        .question-area.vertical-mode #question-text {
            width: min(64%, 225px);
            height: auto;
            overflow: visible;
            align-items: stretch;
            font-size: var(--vertical-font-size);
        }

        .vertical-question {
            width: 100%;
            display: grid;
            justify-items: stretch;
            line-height: 0.92;
            font-variant-numeric: tabular-nums;
        }

        .vertical-number {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            gap: 0.08em;
        }

        .vertical-number .digit-group {
            grid-column: 1;
            justify-self: center;
        }

        .vertical-divider {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            align-items: center;
            gap: 0.08em;
            margin-top: 0.12em;
        }

        .vertical-line {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: var(--secondary-color);
        }

        .vertical-operator {
            display: grid;
            place-items: center;
            font-size: 0.72em;
            line-height: 1;
        }

        .question-area.vertical-mode .answer-display {
            width: min(64%, 225px);
            height: auto;
            min-height: calc(var(--vertical-answer-size) * 1.05);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 0.54em;
            gap: 0.08em;
            border-bottom: 0;
            padding: 0;
            font-size: var(--vertical-answer-size);
        }

        .question-area.vertical-mode .answer-display .digit-group {
            grid-column: 1;
            justify-self: center;
        }

        .numpad {
            flex: 0 0 38%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .handwriting-panel {
            flex: 0 0 38%;
            height: 100%;
            min-height: 0;
            display: none;
            grid-template-rows: minmax(0, 1fr) 58px;
            gap: 10px;
        }

        .handwriting-canvas-wrap {
            position: relative;
            min-height: 0;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            background: var(--input-bg);
        }

        #handwritingCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        .handwriting-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            min-height: 0;
        }

        .btn-handwriting-clear,
        .btn-handwriting-ok {
            border: 1px solid var(--border-color);
            border-radius: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 1000;
            transition: transform 0.14s ease;
        }

        .btn-handwriting-clear {
            background: var(--danger-bg);

<script>
    // ============================================================
    // MESIN PENGENAL TULISAN LOKAL HOG + MLP (REV 25)
    // Tidak membutuhkan TensorFlow.js, model eksternal, atau internet.
    // ============================================================
    let currentLevel = 1;
    let currentOperation = 'add';
    let totalQuestionsSetting = 10;

    const levelConfigs = {
        1: { add: [[1, 5], [1, 5]], subtract: [[1, 5], [1, 5]] },
        2: { add: [[1, 5], [5, 10]], subtract: [[5, 10], [1, 5]] },
        3: { add: [[1, 5], [10, 15]], subtract: [[10, 15], [1, 5]] },
        4: { add: [[1, 5], [15, 20]], subtract: [[15, 20], [1, 5]] },
        5: { add: [[5, 10], [5, 10]], subtract: [[5, 10], [5, 10]] },
        6: { add: [[5, 10], [10, 15]], subtract: [[10, 15], [5, 10]] },
        7: { add: [[5, 10], [15, 20]], subtract: [[15, 20], [5, 10]] },
        8: { add: [[1, 10], [20, 90]], subtract: [[20, 90], [1, 10]] },
        9: { add: [[10, 99], [10, 99]], subtract: [[10, 99], [10, 99]], vertical: true },
        10: { add: [[10, 99], [10, 99]], subtract: [[10, 99], [10, 99]], vertical: false }
    };
    
    let currentQuestionIndex = 0;
    let correctAnswers = 0;
    let wrongAnswers = 0;
    let currentAnswer = ""; 
    let correctAnswerValue = 0; 
    let timerInterval;
    let remainingSeconds = 0;
    let selectedTimeSeconds = 0;
    let gameStartTimestamp = 0;
    let lastQuestionStr = ""; 
    let confettiTimeout;
    let confettiLoopTimeout;
    let timerLimitActive = false;
    let chanceModeEnabled = false;
    let globalLivesRemaining = 3;
    let retryQuestions = [];
    let generatedQuestionCount = 0;
    let currentQuestionData = null;
    let inputLocked = false;
    let feedbackTimeout;
    let gameInProgress = false;
    let inputMode = 'keypad';
    let lastManualInputMode = 'keypad';
    let voiceRecognition = null;
    let voiceAvailable = false;
    let voiceListening = false;
    let voiceCandidateAnswer = '';
    let voiceTranscript = '';
    let voiceState = 'idle';
    let handwritingContext = null;
    let handwritingDrawing = false;
    let handwritingHasInk = false;
    let handwritingLastPoint = null;
    let handwritingRecognitionTimer;
    let handwritingResizeObserver = null;

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatRange(range) {
        return `${range[0]}-${range[1]}`;
    }

    function updateLevelOptions() {
        const selectedOperation = document.querySelector('input[name="operationMode"]:checked').value;
        const levelSelect = document.getElementById('levelSelect');

        Object.keys(levelConfigs).forEach(level => {
            const option = levelSelect.querySelector(`option[value="${level}"]`);
            const config = levelConfigs[level];
            let ranges;
            let symbol;

            if (level === '9' || level === '10') {
                const layoutName = level === '9' ? 'Bersusun' : 'Mendatar';
                const levelDescription = selectedOperation === 'add'
                    ? `2 Digit ${layoutName} tanpa menyimpan`
                    : selectedOperation === 'subtract'
                        ? `2 Digit ${layoutName} tanpa meminjam`
                        : `2 Digit ${layoutName} campuran`;

                option.textContent = `Level ${level} (${levelDescription})`;
                return;
            }

            if (selectedOperation === 'add') {
                ranges = config.add;
                symbol = '+';
            } else if (selectedOperation === 'subtract') {
                ranges = config.subtract;
                symbol = '-';
            } else {
                ranges = config.subtract;
                symbol = '&';
            }

            option.textContent = `Level ${level} (${formatRange(ranges[0])} ${symbol} ${formatRange(ranges[1])})`;
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');

        // Revisi 29: penanda layar aktif dipakai hanya untuk tata letak portrait responsif.
        const appContainer = document.getElementById('app-container');
        if (appContainer) appContainer.dataset.screen = screenId;

        // Revisi 28: timer header disembunyikan hanya pada halaman pengaturan.
        const timerDisplay = document.getElementById('timerDisplay');
        if (timerDisplay) {
            timerDisplay.style.display = screenId === 'menu-screen' ? 'none' : 'grid';
        }
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerColor() {
        const timerDisplay = document.getElementById('timerDisplay');
        if (!timerDisplay) return;

        if (timerLimitActive && remainingSeconds <= 10 && remainingSeconds >= 0) {
            timerDisplay.classList.add('critical');
        } else {
            timerDisplay.classList.remove('critical');
        }
    }

    function updateTimeSummary() {
        const selectedEl = document.getElementById('time-selected-value');
        const usedEl = document.getElementById('time-used-value');
        const remainingEl = document.getElementById('time-remaining-value');

        if (!selectedEl || !usedEl || !remainingEl) return;

        if (selectedTimeSeconds > 0) {
            const safeRemaining = Math.max(Math.min(remainingSeconds, selectedTimeSeconds), 0);
            const usedSeconds = Math.max(selectedTimeSeconds - safeRemaining, 0);

            selectedEl.textContent = formatTime(selectedTimeSeconds);
            usedEl.textContent = formatTime(usedSeconds);
            remainingEl.textContent = formatTime(safeRemaining);
        } else {
            const elapsedSeconds = gameStartTimestamp > 0
                ? Math.max(Math.floor((Date.now() - gameStartTimestamp) / 1000), 0)
                : 0;

            selectedEl.textContent = 'Bebas';
            usedEl.textContent = formatTime(elapsedSeconds);
            remainingEl.textContent = '—';
        }
    }

    function resetHeaderTimer() {
        remainingSeconds = 0;
        timerLimitActive = false;

        const timerDisplay = document.getElementById('timerDisplay');
        if (timerDisplay) {
            timerDisplay.textContent = '00:00';
        }

        updateTimerColor();
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement &&
            !document.mozFullScreenElement &&
            !document.webkitFullscreenElement &&
            !document.msFullscreenElement) {

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    function clampNumber(value, min, max, fallback) {
        const parsed = parseInt(value);
        if (isNaN(parsed)) return fallback;
        return Math.min(Math.max(parsed, min), max);
    }

    function normalizeValue(inputId, min, max, fallback) {
        const input = document.getElementById(inputId);
        const normalized = clampNumber(input.value, min, max, fallback);
        input.value = normalized;
        return normalized;
    }

    function stepValue(inputId, delta, min, max) {
        const input = document.getElementById(inputId);
        let current = parseInt(input.value);
        if (isNaN(current)) current = min;

        let nextValue = current + delta;
        if (nextValue > max) nextValue = min;
        if (nextValue < min) nextValue = max;

        input.value = nextValue;
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function initializeHoldStepButtons() {
        document.querySelectorAll('.step-btn[data-step-input]').forEach(button => {
            const performStep = () => {
                stepValue(
                    button.dataset.stepInput,
                    parseInt(button.dataset.stepDelta),
                    parseInt(button.dataset.stepMin),
                    parseInt(button.dataset.stepMax)
                );
            };

            const stopHold = () => {
                clearTimeout(button._holdDelayTimer);
                clearInterval(button._holdRepeatTimer);
                button._holdDelayTimer = null;
                button._holdRepeatTimer = null;
            };

            button.addEventListener('pointerdown', event => {
                if (typeof event.button === 'number' && event.button !== 0) return;
                event.preventDefault();
                stopHold();
                performStep();

                try {
                    button.setPointerCapture(event.pointerId);

    function setVoiceModeToggleVisibility(visible) {

    function updateVoiceAvailability() {
        const toggles = [
            document.getElementById('voiceModeToggle'),
            document.getElementById('portraitVoiceModeToggle')
        ].filter(Boolean);
        const SpeechRecognitionCtor = getSpeechRecognitionConstructor();
        voiceAvailable = Boolean(navigator.onLine && SpeechRecognitionCtor);

        toggles.forEach(toggle => {
            toggle.disabled = !voiceAvailable;
            toggle.classList.toggle('unavailable', !voiceAvailable);
            toggle.classList.toggle('active', voiceAvailable && inputMode === 'voice');
            toggle.setAttribute('aria-disabled', voiceAvailable ? 'false' : 'true');

            if (!navigator.onLine) {
                toggle.setAttribute('title', 'Suara tidak tersedia saat offline');
            } else if (!SpeechRecognitionCtor) {
                toggle.setAttribute('title', 'Pengenalan suara tidak didukung browser ini');
            } else {
                toggle.setAttribute('title', inputMode === 'voice' ? 'Mode Suara Aktif' : 'Jawab dengan Suara');
            }
        });

        if (!voiceAvailable && inputMode === 'voice') {
            stopVoiceRecognition(true);
            setInputMode(lastManualInputMode);
        }
    }

    function parseIndonesianSpokenNumber(text) {
        if (!text) return null;

        const normalized = String(text)
            .toLowerCase()
            .replace(/[^a-z0-9\s-]/g, ' ')
            .replace(/-/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

        const numericMatch = normalized.match(/(?:^|\s)(\d{1,2})(?:\s|$)/);
        if (numericMatch) {
            const value = Number(numericMatch[1]);
            return value >= 0 && value <= 99 ? value : null;
        }

        const units = {
            nol: 0,
            kosong: 0,
            satu: 1,
            dua: 2,
            tiga: 3,
            empat: 4,
            lima: 5,
            enam: 6,
            tujuh: 7,
            delapan: 8,
            sembilan: 9
        };

        const tokens = normalized.split(' ').filter(Boolean);

        for (let i = 0; i < tokens.length; i++) {
            const token = tokens[i];

            if (token === 'sepuluh') return 10;
            if (token === 'sebelas') return 11;

            if (Object.prototype.hasOwnProperty.call(units, token)) {
                const unit = units[token];
                const next = tokens[i + 1];
                const afterNext = tokens[i + 2];

                if (next === 'belas' && unit >= 2) {
                    return 10 + unit;
                }

                if (next === 'puluh' && unit >= 1) {
                    let value = unit * 10;
                    if (Object.prototype.hasOwnProperty.call(units, afterNext) && units[afterNext] > 0) {
                        value += units[afterNext];
                    }
                    return value <= 99 ? value : null;
                }

                return unit;
            }
        }

        return null;
    }

    function ensureVoiceRecognition() {
        const SpeechRecognitionCtor = getSpeechRecognitionConstructor();
        if (!SpeechRecognitionCtor) return null;
        if (voiceRecognition) return voiceRecognition;

        const recognition = new SpeechRecognitionCtor();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 5;

        recognition.onstart = () => {
            voiceListening = true;
            setVoicePanelState('listening', 'Sedang mendengarkan...');
        };

        recognition.onspeechend = () => {
            if (!voiceListening) return;
            setVoicePanelState('processing', 'Memproses jawaban...');
        };

        recognition.onresult = event => {
            voiceListening = false;
            let best = null;

            for (let resultIndex = event.resultIndex; resultIndex < event.results.length; resultIndex++) {
                const resultSet = event.results[resultIndex];
                for (let altIndex = 0; altIndex < resultSet.length; altIndex++) {
                    const alternative = resultSet[altIndex];
                    const parsed = parseIndonesianSpokenNumber(alternative.transcript);
                    if (parsed === null) continue;

                    const confidence = Number.isFinite(alternative.confidence) ? alternative.confidence : 0;
                    if (!best || confidence > best.confidence) {
                        best = {
                            value: parsed,
                            transcript: alternative.transcript.trim(),
                            confidence
                        };
                    }
                }
            }

            if (!best) {
                voiceCandidateAnswer = '';
                voiceTranscript = '';
                setVoicePanelState('error', 'Jawaban belum terbaca. Tekan mic dan coba lagi.');
                return;
            }

            voiceCandidateAnswer = String(best.value);
            voiceTranscript = best.transcript;

            // Revisi 28: hasil suara langsung tampil di area jawaban utama.
            currentAnswer = voiceCandidateAnswer.slice(0, 2);
            updateInputDisplay();
            setVoicePanelState('result', `Terdengar: “${voiceTranscript}”`);
        };

        recognition.onnomatch = () => {
            voiceListening = false;
            voiceCandidateAnswer = '';
            setVoicePanelState('error', 'Jawaban belum terbaca. Tekan mic dan coba lagi.');
        };

        recognition.onerror = event => {
            voiceListening = false;
            voiceCandidateAnswer = '';

            let message = 'Pengenalan suara gagal. Coba lagi.';
            if (event.error === 'no-speech') message = 'Suara belum terdengar. Coba lagi.';
            if (event.error === 'audio-capture') message = 'Mikrofon tidak tersedia.';
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') message = 'Izinkan akses mikrofon untuk menggunakan suara.';
            if (event.error === 'network') message = 'Koneksi pengenalan suara bermasalah. Coba lagi.';
            if (event.error === 'language-not-supported') message = 'Bahasa Indonesia tidak didukung layanan suara pada browser ini.';

            setVoicePanelState('error', message);
            updateVoiceAvailability();
        };

        recognition.onend = () => {
            voiceListening = false;
            const panel = document.getElementById('voicePanel');
            if (panel) panel.classList.remove('listening');

            if (voiceState === 'listening' || voiceState === 'processing') {
                setVoicePanelState('idle', 'Tekan mic untuk menjawab');
            }
        };

        voiceRecognition = recognition;
        return voiceRecognition;
    }

    function stopVoiceRecognition(silent = false) {
        if (voiceRecognition && voiceListening) {
            try {
                voiceRecognition.abort();
            } catch (error) {}
        }
        voiceListening = false;
        if (!silent) resetVoicePanel();

    function startVoiceRecognition() {
        if (!gameInProgress || inputLocked || inputMode !== 'voice') return;
        updateVoiceAvailability();

        if (!voiceAvailable) {
            resetVoicePanel(navigator.onLine
                ? 'Pengenalan suara tidak didukung browser ini.'
                : 'Mode suara hanya tersedia saat online.');
            return;
        }

        const recognition = ensureVoiceRecognition();
        if (!recognition) return;

        if (voiceListening) {
            try {
                recognition.stop();
            } catch (error) {}
            return;
        }

        voiceCandidateAnswer = '';
        voiceTranscript = '';
        setVoicePanelState('processing', 'Menyiapkan mikrofon...');

        try {
            recognition.start();
        } catch (error) {
            setVoicePanelState('error', 'Mikrofon sedang digunakan. Coba lagi sebentar.');
        }
    }

        if (!gameInProgress || inputLocked || inputMode !== 'voice') return;
        currentAnswer = '';
        updateInputDisplay();
        resetVoicePanel();
        startVoiceRecognition();

    function setInputModeToggleVisibility(visible) {
        const toggle = document.getElementById('inputModeToggle');
        if (!toggle) return;
        toggle.style.display = visible ? 'inline-flex' : 'none';
    }

    function updateInputModeToggle() {
        const icon = document.getElementById('inputModeIcon');
        const toggle = document.getElementById('inputModeToggle');
        const portraitIcon = document.getElementById('portraitInputModeIcon');
        const portraitToggle = document.getElementById('portraitInputModeToggle');
        const portraitText = document.getElementById('portraitInputModeText');

        let iconMarkup = inputModeIcons.pencil;
        let label = 'Tulis dengan tangan';
        let title = 'Tulis Tangan';
        let portraitLabel = 'Tulis';

        if (inputMode === 'voice') {
            const returnToHandwriting = lastManualInputMode === 'handwriting';
            iconMarkup = returnToHandwriting ? inputModeIcons.pencil : inputModeIcons.keyboard;
            label = returnToHandwriting ? 'Kembali ke tulisan tangan' : 'Kembali ke tombol angka';
            title = returnToHandwriting ? 'Tulis Tangan' : 'Tombol Angka';
            portraitLabel = returnToHandwriting ? 'Tulis' : 'Keyboard';
        } else {
            const handwritingActive = inputMode === 'handwriting';
            iconMarkup = handwritingActive ? inputModeIcons.keyboard : inputModeIcons.pencil;
            label = handwritingActive ? 'Gunakan tombol angka' : 'Tulis dengan tangan';
            title = handwritingActive ? 'Tombol Angka' : 'Tulis Tangan';
            portraitLabel = handwritingActive ? 'Keyboard' : 'Tulis';
        }

        if (icon) icon.innerHTML = iconMarkup;
        if (toggle) {
            toggle.setAttribute('aria-label', label);
            toggle.setAttribute('title', title);
        }

        if (portraitIcon) portraitIcon.innerHTML = iconMarkup;
        if (portraitText) portraitText.textContent = portraitLabel;
        if (portraitToggle) {
            portraitToggle.setAttribute('aria-label', label);
            portraitToggle.setAttribute('title', title);
            portraitToggle.classList.toggle('active', inputMode !== 'voice');
        }

        const portraitVoiceToggle = document.getElementById('portraitVoiceModeToggle');
        if (portraitVoiceToggle) {
            portraitVoiceToggle.classList.toggle('active', voiceAvailable && inputMode === 'voice');
        }
    }

    function toggleInputMode() {
        if (!gameInProgress || inputLocked) return;

        if (inputMode === 'voice') {
            setInputMode(lastManualInputMode);
            return;
        }

        setInputMode(inputMode === 'keypad' ? 'handwriting' : 'keypad');
    }

    function setInputMode(mode) {
        let nextMode = mode === 'handwriting' ? 'handwriting' : (mode === 'voice' ? 'voice' : 'keypad');

        if (nextMode === 'voice' && !voiceAvailable) {
            nextMode = lastManualInputMode;
        }

        if (inputMode === 'voice' && nextMode !== 'voice') {
            stopVoiceRecognition(true);
        }

        if (nextMode !== 'voice') {
            lastManualInputMode = nextMode;
        }

        inputMode = nextMode;

        const numpad = document.querySelector('.numpad');
        const handwritingPanel = document.getElementById('handwritingPanel');
        const voicePanel = document.getElementById('voicePanel');
        const voiceToggle = document.getElementById('voiceModeToggle');

        if (numpad) numpad.style.display = nextMode === 'keypad' ? 'grid' : 'none';
        if (handwritingPanel) handwritingPanel.style.display = nextMode === 'handwriting' ? 'grid' : 'none';
        if (voicePanel) voicePanel.style.display = nextMode === 'voice' ? 'grid' : 'none';
        if (voiceToggle) voiceToggle.classList.toggle('active', nextMode === 'voice');

        updateInputModeToggle();
        updateVoiceAvailability();

        if (nextMode === 'handwriting') {
            requestAnimationFrame(() => resizeHandwritingCanvas(true));
        } else if (nextMode === 'voice') {
            resetVoicePanel();
        }
    }

    function initializeHandwritingCanvas() {
        const canvas = document.getElementById('handwritingCanvas');
        if (!canvas) return;

        handwritingContext = canvas.getContext('2d', { willReadFrequently: true });
        resizeHandwritingCanvas(false);

        const getPoint = event => {
            const rect = canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        };

        const beginStroke = event => {
            if (!gameInProgress || inputLocked || inputMode !== 'handwriting') return;
            event.preventDefault();

            if (!handwritingHasInk && currentAnswer !== '') {
                currentAnswer = '';
                updateInputDisplay();
            }

            clearTimeout(handwritingRecognitionTimer);
            handwritingDrawing = true;
            handwritingHasInk = true;
            handwritingLastPoint = getPoint(event);

            try {
                canvas.setPointerCapture(event.pointerId);
            } catch (error) {}

            configureHandwritingBrush();
            handwritingContext.beginPath();
            handwritingContext.moveTo(handwritingLastPoint.x, handwritingLastPoint.y);
            handwritingContext.lineTo(handwritingLastPoint.x + 0.01, handwritingLastPoint.y + 0.01);
            handwritingContext.stroke();
        };

        const continueStroke = event => {
            if (!handwritingDrawing || !handwritingContext) return;
            event.preventDefault();
            const point = getPoint(event);
            configureHandwritingBrush();
            handwritingContext.beginPath();
            handwritingContext.moveTo(handwritingLastPoint.x, handwritingLastPoint.y);
            handwritingContext.lineTo(point.x, point.y);
            handwritingContext.stroke();
            handwritingLastPoint = point;
        };

        const endStroke = event => {
            if (!handwritingDrawing) return;
            event.preventDefault();
            handwritingDrawing = false;
            handwritingLastPoint = null;
            scheduleHandwritingRecognition();
        };

        canvas.addEventListener('pointerdown', beginStroke);
        canvas.addEventListener('pointermove', continueStroke);
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('contextmenu', event => event.preventDefault());

        if ('ResizeObserver' in window) {
            handwritingResizeObserver = new ResizeObserver(() => {
                if (inputMode === 'handwriting') resizeHandwritingCanvas(true);
            });
            handwritingResizeObserver.observe(canvas.parentElement);
        } else {
            window.addEventListener('resize', () => {
                if (inputMode === 'handwriting') resizeHandwritingCanvas(true);
            });
        }
    }

    function configureHandwritingBrush() {
        if (!handwritingContext) return;
        const canvas = document.getElementById('handwritingCanvas');
        const baseSize = Math.max(12, Math.min(canvas.clientWidth, canvas.clientHeight) * 0.055);
        const inkColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim() || '#0f172a';
        handwritingContext.strokeStyle = inkColor;
        handwritingContext.lineWidth = baseSize;
        handwritingContext.lineCap = 'round';
        handwritingContext.lineJoin = 'round';
    }

    function syncHandwritingInkToTheme() {
        const canvas = document.getElementById('handwritingCanvas');
        if (!canvas || !handwritingContext) return;

        const inkColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim() || '#0f172a';

        // Revisi 28: coretan yang sudah ada ikut berubah saat tema diganti.
        if (handwritingHasInk && canvas.width > 0 && canvas.height > 0) {
            handwritingContext.save();
            handwritingContext.setTransform(1, 0, 0, 1, 0, 0);
            handwritingContext.globalCompositeOperation = 'source-in';
            handwritingContext.fillStyle = inkColor;
            handwritingContext.fillRect(0, 0, canvas.width, canvas.height);
            handwritingContext.restore();
        }

        configureHandwritingBrush();
    }

    function resizeHandwritingCanvas(preserveInk = true) {

        const rect = canvas.getBoundingClientRect();
        if (rect.width < 2 || rect.height < 2) return;

            handwritingContext.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, rect.width, rect.height);
        }
    }

    function clearHandwriting(resetAnswer = false) {
        clearTimeout(handwritingRecognitionTimer);
        handwritingDrawing = false;
        handwritingLastPoint = null;
        handwritingHasInk = false;

        const canvas = document.getElementById('handwritingCanvas');
        if (canvas && handwritingContext) {
            handwritingContext.save();
            handwritingContext.setTransform(1, 0, 0, 1, 0, 0);
            handwritingContext.clearRect(0, 0, canvas.width, canvas.height);
            handwritingContext.restore();
        }

        if (resetAnswer) {
            currentAnswer = '';
            updateInputDisplay();
        }
    }

    function scheduleHandwritingRecognition() {
        clearTimeout(handwritingRecognitionTimer);
        handwritingRecognitionTimer = setTimeout(() => {
            if (!handwritingHasInk || inputMode !== 'handwriting' || inputLocked) return;
            const recognized = recognizeHandwrittenAnswer();
            if (recognized !== '') {
                currentAnswer = recognized.slice(0, 2);
                updateInputDisplay();
            }
        }, 260);
    }

    function createAnalysisCanvas() {
        const source = document.getElementById('handwritingCanvas');
        if (!source || !source.width || !source.height) return null;

        const maxSide = 320;
        const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        return canvas;
    }

    function getInkData(canvas) {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const alpha = new Uint8Array(canvas.width * canvas.height);
        let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;

        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
                const a = imageData.data[(y * canvas.width + x) * 4 + 3];
                alpha[y * canvas.width + x] = a;
                if (a > 18) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (maxX < minX || maxY < minY) return null;
        return { alpha, width: canvas.width, height: canvas.height, minX, minY, maxX, maxY };
    }

    function countInkInRegion(ink, x1, x2, y1, y2) {
        let count = 0;
        for (let y = y1; y <= y2; y++) {
            for (let x = x1; x <= x2; x++) {
                if (ink.alpha[y * ink.width + x] > 18) count++;
            }
        }
        return count;
    }

    function splitDigitRegions(ink) {
        const { minX, maxX, minY, maxY } = ink;
        const boxWidth = maxX - minX + 1;
        const boxHeight = maxY - minY + 1;
        const projection = [];

        for (let x = minX; x <= maxX; x++) {
            let sum = 0;
            for (let y = minY; y <= maxY; y++) {
                if (ink.alpha[y * ink.width + x] > 18) sum++;
            }
            projection.push(sum);
        }

        const start = Math.max(1, Math.floor(boxWidth * 0.16));
        const end = Math.min(boxWidth - 2, Math.ceil(boxWidth * 0.84));
        const lowThreshold = Math.max(0, Math.floor(boxHeight * 0.012));
        let bestGap = null;
        let gapStart = -1;

        for (let i = start; i <= end + 1; i++) {
            const isGap = i <= end && projection[i] <= lowThreshold;
            if (isGap && gapStart < 0) gapStart = i;
            if ((!isGap || i === end + 1) && gapStart >= 0) {
                const gapEnd = i - 1;
                const gapLength = gapEnd - gapStart + 1;
                if (!bestGap || gapLength > bestGap.length) {
                    bestGap = { start: gapStart, end: gapEnd, length: gapLength };
                }
                gapStart = -1;
            }
        }

        let splitX = null;
        if (bestGap) {
            const candidate = minX + Math.floor((bestGap.start + bestGap.end) / 2);
            const leftInk = countInkInRegion(ink, minX, candidate - 1, minY, maxY);
            const rightInk = countInkInRegion(ink, candidate + 1, maxX, minY, maxY);
            const minSideInk = Math.max(8, Math.round(boxHeight * 0.12));
            if (leftInk >= minSideInk && rightInk >= minSideInk && bestGap.length >= Math.max(2, Math.round(boxWidth * 0.018))) {
                splitX = candidate;
            }
        }

        // Jika dua angka ditulis sangat dekat tanpa kolom benar-benar kosong,
        // cari lembah proyeksi di area tengah hanya bila bentuk keseluruhan cukup lebar.
        if (splitX === null && boxWidth / Math.max(boxHeight, 1) > 0.92) {
            const valleyStart = Math.floor(boxWidth * 0.30);
            const valleyEnd = Math.ceil(boxWidth * 0.70);
            let bestIndex = valleyStart;
            let bestValue = Infinity;
            let average = 0;
            for (let i = valleyStart; i <= valleyEnd; i++) {
                average += projection[i] || 0;
                if ((projection[i] || 0) < bestValue) {
                    bestValue = projection[i] || 0;
                    bestIndex = i;
                }
            }
            average /= Math.max(1, valleyEnd - valleyStart + 1);
            const candidate = minX + bestIndex;
            const leftInk = countInkInRegion(ink, minX, candidate, minY, maxY);
            const rightInk = countInkInRegion(ink, candidate + 1, maxX, minY, maxY);
            if (bestValue <= average * 0.36 && leftInk > boxHeight * 0.12 && rightInk > boxHeight * 0.12) {
                splitX = candidate;
            }
        }

        if (splitX === null) {
            return [{ x1: minX, x2: maxX, y1: minY, y2: maxY }];
        }

        return [
            { x1: minX, x2: splitX - 1, y1: minY, y2: maxY },
            { x1: splitX + 1, x2: maxX, y1: minY, y2: maxY }
        ];
    }

    function tightenDigitRegion(ink, region) {
        let minX = region.x2, minY = region.y2, maxX = region.x1, maxY = region.y1;
        for (let y = region.y1; y <= region.y2; y++) {
            for (let x = region.x1; x <= region.x2; x++) {
                if (ink.alpha[y * ink.width + x] > 18) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }
        if (maxX < minX || maxY < minY) return region;
        return { x1: minX, x2: maxX, y1: minY, y2: maxY };
    }

    function shiftNormalizedDigit32(source, shiftX, shiftY) {
        const size = 32;
        const shifted = new Float32Array(size * size);

        for (let y = 0; y < size; y++) {
            const sourceY = y - shiftY;
            const y0 = Math.floor(sourceY);
            const fy = sourceY - y0;

            for (let x = 0; x < size; x++) {
                const sourceX = x - shiftX;
                const x0 = Math.floor(sourceX);
                const fx = sourceX - x0;

                let value = 0;
                for (let oy = 0; oy <= 1; oy++) {
                    const sy = y0 + oy;
                    if (sy < 0 || sy >= size) continue;
                    const wy = oy === 0 ? 1 - fy : fy;

                    for (let ox = 0; ox <= 1; ox++) {
                        const sx = x0 + ox;
                        if (sx < 0 || sx >= size) continue;
                        const wx = ox === 0 ? 1 - fx : fx;
                        value += source[sy * size + sx] * wx * wy;
                    }
                }
                shifted[y * size + x] = value;
            }
        }

        return shifted;
    }

    function normalizeDigit32(canvas, ink, rawRegion) {
        const region = tightenDigitRegion(ink, rawRegion);
        const sourceWidth = Math.max(1, region.x2 - region.x1 + 1);
        const sourceHeight = Math.max(1, region.y2 - region.y1 + 1);
        const target = document.createElement('canvas');
        target.width = 32;
        target.height = 32;
        const ctx = target.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, 32, 32);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Pertahankan rasio digit dan beri margin agar bentuk tidak terdistorsi.
        const maxHeight = 28;
        const maxWidth = 24;
        const scale = Math.min(maxWidth / sourceWidth, maxHeight / sourceHeight);
        const drawWidth = Math.max(1, sourceWidth * scale);
        const drawHeight = Math.max(1, sourceHeight * scale);
        const dx = (32 - drawWidth) / 2;
        const dy = (32 - drawHeight) / 2;

        ctx.drawImage(
            canvas,
            region.x1, region.y1, sourceWidth, sourceHeight,
            dx, dy, drawWidth, drawHeight
        );

        const rgba = ctx.getImageData(0, 0, 32, 32).data;
        const pixels = new Float32Array(1024);
        let mass = 0;
        let sumX = 0;
        let sumY = 0;

        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                const i = y * 32 + x;
                const value = rgba[i * 4 + 3] / 255;
                pixels[i] = value;
                mass += value;
                sumX += value * x;
                sumY += value * y;
            }
        }

        if (mass <= 0.000001) return pixels;

        // Koreksi center-of-mass ringan agar tulisan yang agak bergeser tetap stabil.
        const centerX = sumX / mass;
        const centerY = sumY / mass;
        const shiftX = Math.max(-3, Math.min(3, 15.5 - centerX));
        const shiftY = Math.max(-3, Math.min(3, 15.5 - centerY));

        if (Math.abs(shiftX) < 0.001 && Math.abs(shiftY) < 0.001) return pixels;
        return shiftNormalizedDigit32(pixels, shiftX, shiftY);
    }

    function extractHOGFeatures32(pixels) {
        const size = 32;
        const bins = 9;
        const cellSize = 8;
        const cellsPerSide = 4;
        const gradientX = new Float32Array(size * size);
        const gradientY = new Float32Array(size * size);

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const i = y * size + x;
                const left = pixels[y * size + Math.max(0, x - 1)];
                const right = pixels[y * size + Math.min(size - 1, x + 1)];
                const top = pixels[Math.max(0, y - 1) * size + x];
                const bottom = pixels[Math.min(size - 1, y + 1) * size + x];
                gradientX[i] = right - left;
                gradientY[i] = bottom - top;
            }
        }

        const cellHistograms = new Float32Array(cellsPerSide * cellsPerSide * bins);

        for (let y = 0; y < size; y++) {
            const cellY = Math.floor(y / cellSize);
            for (let x = 0; x < size; x++) {
                const i = y * size + x;
                const gx = gradientX[i];
                const gy = gradientY[i];
                const magnitude = Math.sqrt(gx * gx + gy * gy);
                if (magnitude <= 0.000001) continue;

                let angle = Math.atan2(gy, gx) * 180 / Math.PI;
                if (angle < 0) angle += 180;
                if (angle >= 180) angle -= 180;

                const binPosition = angle / 20;
                const lowerBase = Math.floor(binPosition);
                const fraction = binPosition - lowerBase;
                const lowerBin = lowerBase % bins;
                const upperBin = (lowerBin + 1) % bins;
                const cellX = Math.floor(x / cellSize);
                const base = (cellY * cellsPerSide + cellX) * bins;

                cellHistograms[base + lowerBin] += magnitude * (1 - fraction);
                cellHistograms[base + upperBin] += magnitude * fraction;
            }
        }

        // 4x4 cells -> blok 2x2 dengan stride 1 -> 3x3 blok x 36 = 324 fitur.
        const features = new Float32Array(324);
        let featureIndex = 0;
        const block = new Float32Array(36);

        for (let blockY = 0; blockY < 3; blockY++) {
            for (let blockX = 0; blockX < 3; blockX++) {
                let blockIndex = 0;
                let normSq = 0;

                for (let cellY = 0; cellY < 2; cellY++) {
                    for (let cellX = 0; cellX < 2; cellX++) {
                        const base = (((blockY + cellY) * cellsPerSide) + blockX + cellX) * bins;
                        for (let bin = 0; bin < bins; bin++) {
                            const value = cellHistograms[base + bin];
                            block[blockIndex++] = value;
                            normSq += value * value;
                        }
                    }
                }

                let norm = Math.sqrt(normSq + 1e-12);
                let clippedNormSq = 0;
                for (let i = 0; i < 36; i++) {
                    const value = Math.min(block[i] / norm, 0.2);
                    block[i] = value;
                    clippedNormSq += value * value;
                }

                norm = Math.sqrt(clippedNormSq + 1e-12);
                for (let i = 0; i < 36; i++) {
                    features[featureIndex++] = block[i] / norm;
                }
            }
        }

        return features;
    }

    function classifyDigit(vector) {
        const model = digitRecognitionModel;
        const hidden = new Float32Array(model.hiddenSize);

        for (let h = 0; h < model.hiddenSize; h++) {
            let sum = model.b1[h];
            for (let i = 0; i < model.inputSize; i++) {
                sum += vector[i] * model.w1[i * model.hiddenSize + h] * model.w1Scale;
            }
            hidden[h] = sum > 0 ? sum : 0;
        }

        const logits = new Float32Array(model.outputSize);
        let bestDigit = 0;
        let maxLogit = -Infinity;

        for (let digit = 0; digit < model.outputSize; digit++) {
            let sum = model.b2[digit];
            for (let h = 0; h < model.hiddenSize; h++) {
                sum += hidden[h] * model.w2[h * model.outputSize + digit] * model.w2Scale;
            }
            logits[digit] = sum;
            if (sum > maxLogit) {
                maxLogit = sum;
                bestDigit = digit;
            }
        }

        let expSum = 0;
        let bestExp = 0;
        for (let digit = 0; digit < model.outputSize; digit++) {
            const value = Math.exp(logits[digit] - maxLogit);
            expSum += value;
            if (digit === bestDigit) bestExp = value;
        }

        return {
            digit: bestDigit,
            confidence: expSum > 0 ? bestExp / expSum : 0
        };
    }

    function recognizeHandwrittenAnswer() {
        const analysisCanvas = createAnalysisCanvas();
        if (!analysisCanvas) return '';
        const ink = getInkData(analysisCanvas);
        if (!ink) return '';

        const regions = splitDigitRegions(ink).slice(0, 2);
        return regions.map(region => {
            const pixels = normalizeDigit32(analysisCanvas, ink, region);
            const features = extractHOGFeatures32(pixels);
            return String(classifyDigit(features).digit);
        }).join('');
    }

    function startGame() {
        clearConfetti();
        currentLevel = parseInt(document.getElementById('levelSelect').value);
        currentOperation = document.querySelector('input[name="operationMode"]:checked').value;
        
        const qVal = normalizeValue('questionCount', 1, 100, 20);
        totalQuestionsSetting = (qVal === 0 || isNaN(qVal)) ? Infinity : qVal;

        const minutes = normalizeValue('timeMin', 0, 60, 1);
        const seconds = normalizeValue('timeSec', 0, 59, 0);
        
        currentQuestionIndex = 0;
        correctAnswers = 0;
        wrongAnswers = 0;
        currentAnswer = "";
        lastQuestionStr = "";
        chanceModeEnabled = document.getElementById('chanceMode').checked;
        globalLivesRemaining = 3;
        retryQuestions = [];
        generatedQuestionCount = 0;
        currentQuestionData = null;
        inputLocked = false;
        gameInProgress = true;
        inputMode = 'keypad';
        lastManualInputMode = 'keypad';
        clearTimeout(feedbackTimeout);
        clearHandwriting(false);
        stopVoiceRecognition(true);
        setInputMode('keypad');
        setVoiceModeToggleVisibility(true);
        setInputModeToggleVisibility(true);
        resetVoicePanel();
        setLivesVisibility(chanceModeEnabled && totalQuestionsSetting !== Infinity);
        renderLives(3);

        selectedTimeSeconds = (minutes * 60) + seconds;
        remainingSeconds = selectedTimeSeconds;

        timerLimitActive = remainingSeconds > 0;

        updateTimerColor();

        generateQuestion();
